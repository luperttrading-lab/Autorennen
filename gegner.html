<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorennen – Entwürfe für die anderen Autos</title>
<style>
  body { margin: 0; background: #1b1e26; color: #f1efe6; font-family: -apple-system, system-ui, sans-serif; }
  header { padding: 16px 16px 4px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 14px 16px 30px; }
  .card { background: #242833; border-radius: 14px; overflow: hidden; }
  .card canvas { display: block; width: 100%; height: auto; }
  .card .txt { padding: 10px 14px 14px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card h2 b { color: #f2b632; margin-right: 6px; }
  .card p { margin: 0; font-size: 14px; line-height: 1.4; opacity: .85; }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Andere Autos – vier Entwürfe, flacher und breiter</h1>
  <p>Oben: Vergleich alt (Höhe 60 % der Breite) gegen neu, dazu dein rotes Auto zum Größenvergleich bei 140 %.
     Darunter die Entwürfe einzeln, jeweils in mehreren Farben, tags und nachts. Such dir einen aus – oder „alle gemischt“.</p>
</header>
<div class="grid" id="grid"></div>
<script>
let ctx;
const RED = '#d40000', RED_DARK = '#9e0000', RED_LIGHT = '#ff3b30';
function rrect(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function ell(x, y, rx, ry, c, a0 = 0, a1 = Math.PI * 2) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }

// Breite Reifen mit Profil, links/rechts außen
function tires(x, y, w, outer = 0.52, tw = 0.2, th = 0.3) {
  for (const s of [-1, 1]) {
    const tx = x + s * (outer - tw / 2) * w - tw * w / 2, ty = y - th * w;
    rrect(tx, ty, tw * w, th * w, tw * w * 0.2, '#111');
    rrect(tx + tw * w * 0.12, ty + th * w * 0.06, tw * w * 0.76, th * w * 0.86, 2, '#2c2c2c');
    ctx.fillStyle = '#0a0a0a';
    for (let g = 1; g < 5; g++) ctx.fillRect(tx + tw * w * 0.12, ty + th * w * g * 0.19, tw * w * 0.76, th * w * 0.05);
    ctx.fillStyle = '#3d3d3d';
    ctx.fillRect(s < 0 ? tx + tw * w * 0.02 : tx + tw * w * 0.86, ty + th * w * 0.1, tw * w * 0.12, th * w * 0.8);
  }
}
function shadow(x, y, w) { ell(x, y + w * 0.01, w * 0.6, w * 0.07, 'rgba(0,0,0,0.45)'); }

// Zwei Insassen ab Schulter; rim = Höhe der Cockpitkante. Haare der Beifahrerin wehen im Fahrtwind.
function occupants(x, rim, w, t, opt = {}) {
  const r = w * 0.085, dx = w * 0.17, hy = rim - w * 0.13;
  // Fahrer links
  ell(x - dx, rim + w * 0.01, r * 1.7, r * 1.1, opt.shirtL || '#2a4d9b', Math.PI, 0);
  circle(x - dx - r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx + r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx, hy, r, '#5a3418');
  circle(x - dx - r * 0.3, hy - r * 0.35, r * 0.35, '#7a4a26');
  if (opt.cap) { ell(x - dx, hy - r * 0.25, r * 1.05, r * 0.8, opt.cap, Math.PI, 0); }
  // Beifahrerin rechts: lange Haare, Spitzen wehen nach außen
  ell(x + dx, rim + w * 0.01, r * 1.6, r * 1.05, opt.shirtR || '#e8578f', Math.PI, 0);
  const wave = Math.sin(t * 9) * r * 0.25;
  ctx.fillStyle = '#f5c542';
  ctx.beginPath();
  ctx.moveTo(x + dx - r * 1.05, hy);
  ctx.quadraticCurveTo(x + dx - r * 1.3, hy + r * 1.3, x + dx - r * 0.6 + wave * 0.3, hy + r * 1.7);
  ctx.lineTo(x + dx + r * 1.5 + wave, hy + r * 1.4);
  ctx.quadraticCurveTo(x + dx + r * 1.4, hy + r * 0.4, x + dx + r * 1.0, hy);
  ctx.closePath(); ctx.fill();
  circle(x + dx, hy - r * 0.05, r * 1.05, '#f5c542');
  circle(x + dx - r * 0.3, hy - r * 0.4, r * 0.35, '#ffe08a');
  if (opt.ribbon) rrect(x + dx - r * 1.05, hy - r * 0.35, r * 2.1, r * 0.3, 2, opt.ribbon);
}

function carB(x, y, w, t) {
  const bob = Math.sin(t * 22) * w * 0.004; y += bob;
  shadow(x, y, w);                // beim Schleudern malt render den Schatten ungedreht
  tires(x, y, w, 0.52, 0.21, 0.26);
  const rim = y - w * 0.33;
  occupants(x, rim, w, t, { shirtL: '#ffffff', shirtR: '#1b1b1b' });
  // Keil-Heck: oben schmaler
  poly([[x - w * 0.38, rim - w * 0.01], [x + w * 0.38, rim - w * 0.01], [x + w * 0.49, rim + w * 0.12],
        [x + w * 0.48, y - w * 0.05], [x - w * 0.48, y - w * 0.05], [x - w * 0.49, rim + w * 0.12]], RED);
  poly([[x - w * 0.4, rim - w * 0.04], [x + w * 0.4, rim - w * 0.04], [x + w * 0.42, rim], [x - w * 0.42, rim]], RED_DARK); // Spoilerlippe
  // Leuchtband
  rrect(x - w * 0.46, rim + w * 0.1, w * 0.92, w * 0.075, 2, '#140000');
  rrect(x - w * 0.44, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rrect(x + w * 0.19, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rrect(x - w * 0.17, rim + w * 0.13, w * 0.34, w * 0.012, 1, '#ff2a2a');
  // Diffusor mit Lamellen, vier Endrohre
  rrect(x - w * 0.36, y - w * 0.11, w * 0.72, w * 0.07, 2, '#151515');
  ctx.fillStyle = '#2a2a2a';
  for (let i = -2; i <= 2; i++) ctx.fillRect(x + i * w * 0.07 - w * 0.006, y - w * 0.11, w * 0.012, w * 0.07);
  for (const ex of [-0.3, -0.24, 0.24, 0.3]) { circle(x + ex * w, y - w * 0.07, w * 0.024, '#888'); circle(x + ex * w, y - w * 0.07, w * 0.015, '#111'); }
}
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

// ---- Hilfen ----
function shade(hex, f) {                       // f < 0 dunkler, f > 0 heller
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
function wheels(x, y, w, outer, tw, th) {       // schmale Reifen, ragen unten unter der Karosserie hervor
  for (const s of [-1, 1]) rrect(x + s * (outer - tw / 2) * w - tw * w / 2, y - th * w, tw * w, th * w, tw * w * 0.25, '#121212');
}
function lightsOn(x, y, r, c) {                 // Leuchtschein (nachts)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},0.8)`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function plate(x, y, w) { rrect(x - w * 0.1, y, w * 0.2, w * 0.05, 1, '#f4f4f0'); rrect(x - w * 0.1, y, w * 0.025, w * 0.05, 1, '#2a4fb0'); }

// Alle Entwürfe: Fußpunkt unten Mitte (x, y), Breite w, Farbe c, nachts n. Höhe steht im Namen der Funktion.

// A Limousine – Höhe 48 % der Breite
function oppA(x, y, w, c, n) {
  shadow(x, y, w); wheels(x, y, w, 0.47, 0.13, 0.12);
  const top = y - w * 0.48;
  poly([[x - w * 0.31, top], [x + w * 0.31, top], [x + w * 0.4, y - w * 0.29], [x - w * 0.4, y - w * 0.29]], shade(c, -0.15)); // Dach + Säulen
  poly([[x - w * 0.27, top + w * 0.03], [x + w * 0.27, top + w * 0.03], [x + w * 0.34, y - w * 0.3], [x - w * 0.34, y - w * 0.3]], '#1d2a3a'); // Heckscheibe
  poly([[x - w * 0.22, top + w * 0.05], [x - w * 0.05, top + w * 0.05], [x - w * 0.16, y - w * 0.31], [x - w * 0.29, y - w * 0.31]], 'rgba(255,255,255,0.10)');
  rrect(x - w * 0.47, y - w * 0.31, w * 0.94, w * 0.24, w * 0.04, c);                     // Kofferraum
  rrect(x - w * 0.47, y - w * 0.31, w * 0.94, w * 0.025, w * 0.02, shade(c, 0.25));      // Glanzkante
  rrect(x - w * 0.45, y - w * 0.255, w * 0.2, w * 0.065, w * 0.015, n ? '#ff3030' : '#c41616');  // Rücklichter
  rrect(x + w * 0.25, y - w * 0.255, w * 0.2, w * 0.065, w * 0.015, n ? '#ff3030' : '#c41616');
  rrect(x - w * 0.43, y - w * 0.24, w * 0.06, w * 0.035, 1, '#f0a020');
  rrect(x + w * 0.37, y - w * 0.24, w * 0.06, w * 0.035, 1, '#f0a020');
  plate(x, y - w * 0.2, w);
  rrect(x - w * 0.49, y - w * 0.1, w * 0.98, w * 0.07, w * 0.03, '#1a1a1a');              // Stoßfänger
  circle(x - w * 0.3, y - w * 0.05, w * 0.018, '#777');
  if (n) for (const s of [-1, 1]) lightsOn(x + s * w * 0.35, y - w * 0.22, w * 0.2, '255,40,30');
}

// B Kompakt-Kombi – Höhe 55 % der Breite, steiles Heck, Dachreling, hohe Leuchten
function oppB(x, y, w, c, n) {
  shadow(x, y, w); wheels(x, y, w, 0.46, 0.13, 0.12);
  const top = y - w * 0.55;
  rrect(x - w * 0.36, top - w * 0.02, w * 0.72, w * 0.02, 1, '#333');                     // Dachreling
  poly([[x - w * 0.36, top], [x + w * 0.36, top], [x + w * 0.44, y - w * 0.3], [x - w * 0.44, y - w * 0.3]], c);
  poly([[x - w * 0.3, top + w * 0.035], [x + w * 0.3, top + w * 0.035], [x + w * 0.35, y - w * 0.33], [x - w * 0.35, y - w * 0.33]], '#1d2a3a');
  poly([[x - w * 0.25, top + w * 0.05], [x - w * 0.08, top + w * 0.05], [x - w * 0.18, y - w * 0.34], [x - w * 0.31, y - w * 0.34]], 'rgba(255,255,255,0.10)');
  rrect(x - w * 0.12, top + w * 0.035, w * 0.24, w * 0.02, 1, n ? '#ff3030' : '#a01010');  // drittes Bremslicht
  rrect(x - w * 0.46, y - w * 0.32, w * 0.92, w * 0.23, w * 0.035, c);
  rrect(x - w * 0.46, y - w * 0.32, w * 0.92, w * 0.02, w * 0.02, shade(c, 0.25));
  for (const s of [-1, 1]) {                                                               // hohe, schmale Leuchten am Heck
    rrect(x + s * w * 0.4 - w * 0.05, y - w * 0.42, w * 0.1, w * 0.17, w * 0.02, n ? '#ff3030' : '#c41616');
    rrect(x + s * w * 0.4 - w * 0.035, y - w * 0.34, w * 0.07, w * 0.03, 1, '#eeeeee');
  }
  plate(x, y - w * 0.22, w);
  rrect(x - w * 0.48, y - w * 0.1, w * 0.96, w * 0.07, w * 0.03, '#202020');
  if (n) for (const s of [-1, 1]) lightsOn(x + s * w * 0.4, y - w * 0.35, w * 0.2, '255,40,30');
}

// C Sportcoupé – Höhe 40 % der Breite, breite Kotflügel, Leuchtband, Spoiler
function oppC(x, y, w, c, n) {
  shadow(x, y, w); wheels(x, y, w, 0.5, 0.17, 0.13);
  const top = y - w * 0.4;
  poly([[x - w * 0.25, top], [x + w * 0.25, top], [x + w * 0.36, y - w * 0.24], [x - w * 0.36, y - w * 0.24]], shade(c, -0.15));
  poly([[x - w * 0.21, top + w * 0.025], [x + w * 0.21, top + w * 0.025], [x + w * 0.29, y - w * 0.25], [x - w * 0.29, y - w * 0.25]], '#18222e');
  poly([[x - w * 0.5, y - w * 0.27], [x + w * 0.5, y - w * 0.27], [x + w * 0.5, y - w * 0.07], [x - w * 0.5, y - w * 0.07]], c);
  poly([[x - w * 0.42, y - w * 0.3], [x + w * 0.42, y - w * 0.3], [x + w * 0.45, y - w * 0.265], [x - w * 0.45, y - w * 0.265]], '#151515'); // Spoiler
  rrect(x - w * 0.46, y - w * 0.22, w * 0.92, w * 0.035, 1, n ? '#ff2a2a' : '#b01010');  // Leuchtband
  plate(x, y - w * 0.165, w);
  rrect(x - w * 0.4, y - w * 0.09, w * 0.8, w * 0.05, w * 0.02, '#121212');               // Diffusor
  for (const ex of [-0.33, 0.33]) { circle(x + ex * w, y - w * 0.065, w * 0.022, '#888'); circle(x + ex * w, y - w * 0.065, w * 0.013, '#111'); }
  if (n) for (const s of [-1, 0, 1]) lightsOn(x + s * w * 0.32, y - w * 0.2, w * 0.17, '255,40,30');
}

// D Geländewagen – Höhe 60 % der Breite, kantig, Reserverad
function oppD(x, y, w, c, n) {
  shadow(x, y, w); wheels(x, y, w, 0.47, 0.15, 0.14);
  const top = y - w * 0.6;
  rrect(x - w * 0.42, top, w * 0.84, w * 0.25, w * 0.04, c);
  rrect(x - w * 0.36, top + w * 0.04, w * 0.72, w * 0.16, w * 0.02, '#1d2a3a');
  rrect(x - w * 0.31, top + w * 0.05, w * 0.12, w * 0.14, 2, 'rgba(255,255,255,0.09)');
  rrect(x - w * 0.47, y - w * 0.36, w * 0.94, w * 0.27, w * 0.035, shade(c, -0.08));
  for (const s of [-1, 1]) rrect(x + s * w * 0.405 - w * 0.045, y - w * 0.35, w * 0.09, w * 0.13, w * 0.015, n ? '#ff3030' : '#c41616');
  circle(x, y - w * 0.24, w * 0.12, '#151515'); circle(x, y - w * 0.24, w * 0.07, '#2c2c2c'); circle(x, y - w * 0.24, w * 0.025, '#777'); // Reserverad
  plate(x - w * 0.26, y - w * 0.18, w * 0.8);
  rrect(x - w * 0.49, y - w * 0.11, w * 0.98, w * 0.08, w * 0.02, '#262626');
  if (n) for (const s of [-1, 1]) lightsOn(x + s * w * 0.4, y - w * 0.29, w * 0.2, '255,40,30');
}

// alt im Spiel: Trapez mit Höhe 60 % (zum Vergleich)
function oppOld(x, y, w, c) {
  const h = w * 0.6, l = x - w / 2, top = y - h;
  ell(x, y, w * 0.55, h * 0.14, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(l + w * 0.1, y); ctx.lineTo(l + w * 0.9, y); ctx.lineTo(l + w, top + h * 0.4); ctx.lineTo(l + w * 0.8, top); ctx.lineTo(l + w * 0.2, top); ctx.lineTo(l, top + h * 0.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(l + w * 0.25, top + h * 0.1, w * 0.5, h * 0.3);
  ctx.fillStyle = '#ff4d4d'; ctx.fillRect(l + w * 0.1, top + h * 0.82, w * 0.2, h * 0.1); ctx.fillRect(l + w * 0.7, top + h * 0.82, w * 0.2, h * 0.1);
  ctx.fillStyle = '#000'; ctx.fillRect(l - w * 0.04, top + h * 0.6, w * 0.12, h * 0.4); ctx.fillRect(l + w * 0.92, top + h * 0.6, w * 0.12, h * 0.4);
}

const COLS = ['#1e5bd6', '#f2c200', '#ffffff', '#ff7a00', '#7a2bd6', '#1a1a1a', '#00a3a3'];
const D = [
  ['A', 'Limousine', oppA, 'Stufenheck, breite Rücklichter, Kennzeichen, Stoßfänger. Höhe 48 % der Breite (vorher 60 %).'],
  ['B', 'Kompakt-Kombi', oppB, 'Steiles Heck mit Dachreling, hohe schmale Leuchten, drittes Bremslicht. Höhe 55 %.'],
  ['C', 'Sportcoupé', oppC, 'Flach und breit wie dein Auto, Leuchtband, Spoiler, Diffusor. Höhe 40 %.'],
  ['D', 'Geländewagen', oppD, 'Kantig mit Reserverad – so hoch wie bisher (60 %), wirkt durch die kastige Form aber breiter. Nur als seltene Abwechslung gedacht.'],
];

function road(W, H, night) {
  const hz = H * 0.28;
  ctx.fillStyle = night ? '#0e1424' : '#8fc0ea'; ctx.fillRect(0, 0, W, hz);
  ctx.fillStyle = night ? '#16301a' : '#5aa040'; ctx.fillRect(0, hz, W, H - hz);
  ctx.fillStyle = night ? '#2a2a30' : '#6c655e';
  ctx.beginPath(); ctx.moveTo(W * 0.46, hz); ctx.lineTo(W * 0.54, hz); ctx.lineTo(W * 1.25, H); ctx.lineTo(-W * 0.25, H); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  for (const f of [-1 / 3, 1 / 3]) { ctx.beginPath(); ctx.moveTo(W / 2 + f * W * 0.04, hz); ctx.lineTo(W / 2 + f * W * 0.75, H); ctx.stroke(); }
  return hz;
}
function card(cls, w, h, title, text) {
  const d = document.createElement('div'); d.className = 'card ' + cls;
  const cv = document.createElement('canvas'); cv.width = w * 2; cv.height = h * 2; d.appendChild(cv);
  const t = document.createElement('div'); t.className = 'txt'; t.innerHTML = `<h2>${title}</h2><p>${text}</p>`; d.appendChild(t);
  document.getElementById('grid').appendChild(d);
  ctx = cv.getContext('2d'); ctx.scale(2, 2); return [w, h];
}
function scene(fns, night, label) {
  const [W, H] = card('wide', 760, 330, label, '');
  const hz = road(W, H, night);
  const P = (z) => ({ y: hz + (H - hz) * z, w: 150 * 1.4 * 0.62 * z });   // Gegner bei 140 % im gleichen Maßstab wie das eigene Auto
  const spots = [[0.25, -0.55], [0.32, 0.5], [0.45, -0.1], [0.62, 0.62], [0.7, -0.62]];
  spots.forEach(([z, lane], i) => { const p = P(z); fns[i % fns.length](W / 2 + lane * (W * 0.75) * z, p.y, p.w, COLS[i], night); });
  carB(W / 2, H - 14, 150, 0);
  if (night) { ctx.fillStyle = 'rgba(0,0,30,0.0)'; }
}

scene([oppOld], false, 'Bisher im Spiel (Höhe 60 % der Breite) – neben deinem Auto, Gegner bei 140 %');
scene([oppA, oppB, oppC, oppD], false, 'Neu: A, B, C, D gemischt – gleicher Maßstab');
for (const [k, name, fn, txt] of D) {
  const [W, H] = card('', 380, 230, `<b>${k}</b>${name}`, txt);
  ctx.fillStyle = '#6c655e'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5a544e'; ctx.fillRect(0, H * 0.82, W, H * 0.18);
  fn(W * 0.36, H * 0.86, 210, COLS[D.indexOf(D.find(e => e[0] === k))], false);
  fn(W * 0.82, H * 0.5, 70, COLS[3], false); fn(W * 0.82, H * 0.86, 70, COLS[5], true);
  fn(W * 0.66, H * 0.3, 32, COLS[2], false); fn(W * 0.82, H * 0.3, 32, COLS[4], false); fn(W * 0.95, H * 0.3, 18, COLS[6], false);
}
scene([oppA, oppB, oppC, oppD], true, 'Nachts');
</script>
</body>
</html>
