<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Diese Tags machen es zur Vollbild-App auf dem iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Autorennen</title>
    <style>
        /* Versionsnummer oben rechts: Tipp prüft auf Update */
        #ver {
            position: absolute;
            top: max(env(safe-area-inset-top), 20px);
            right: 16px;
            z-index: 20;
            padding: 6px 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            text-decoration: underline dotted;
            text-underline-offset: 4px;
            background: none;
            border: 0;
            font-family: inherit;
            cursor: pointer;
        }
        /* Update-Banner: liegt über dem Spiel (fixed), schiebt nichts */
        .update {
            position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #34c759; color: #06240e;
            padding: 12px 14px; border-radius: 14px; font-weight: 600; font-size: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5);
            opacity: 0; transition: opacity .35s ease; pointer-events: none;
        }
        .update.an { opacity: 1; pointer-events: auto; }
        .update[hidden] { display: none; }
        .update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
        .update button { padding: 8px 14px; font: 600 15px sans-serif; border: 0; border-radius: 9px; background: #06240e; color: #fff; cursor: pointer; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Himmelblau */
            touch-action: none; /* Verhindert Scrollen/Zoomen beim Spielen */
            font-family: sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .red { color: #ff3333; }
        /* Start- und Ende-Bildschirm über dem Spielbild */
        .overlay {
            position: absolute; inset: 0; z-index: 15;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            color: white; font-family: 'Courier New', Courier, monospace; text-shadow: 3px 3px 0 #000; text-align: center;
        }
        .overlay[hidden] { display: none; }
        .overlay .big { font-size: 40px; font-weight: bold; line-height: 1.1; }
        .overlay .small { font-size: 15px; opacity: .9; text-shadow: 1px 1px 0 #000; }
        .startBtn {
            font: bold 30px 'Courier New', Courier, monospace; letter-spacing: .08em;
            color: #fff; background: #d40000; border: 4px solid #fff; border-radius: 18px;
            padding: 14px 40px; box-shadow: 0 6px 0 #7a0000, 0 10px 20px rgba(0,0,0,.4);
            cursor: pointer; touch-action: manipulation;
        }
        .startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a0000; }
        .startBtn:disabled { opacity: .5; }
        /* Oben das Spielbild, unten das Bedienfeld (wie bei Passfahrt) */
        #game {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #panel {
            flex: 0 0 auto;
            height: 20vh;
            max-height: 170px;
            min-height: 120px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #242833;
            border-top: 3px solid #11131a;
            padding: 0 16px max(env(safe-area-inset-bottom), 8px) 0;
            box-sizing: border-box;
        }
        /* Querformat: Bedienfeld liegt durchsichtig über dem unteren Bildrand */
        @media (orientation: landscape) {
            #panel {
                position: absolute; left: 0; right: 0; bottom: 0;
                height: 50vh; max-height: none; min-height: 0;
                background: transparent; border-top: 0;
            }
        }
        #ui {
            position: absolute;
            top: max(env(safe-area-inset-top), 20px);
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none;
        }
        /* Turbo: kleiner runder Knopf unten rechts, Füllstand = Turbo-Vorrat */
        #turbo {
            position: relative;
            flex: 0 0 auto;
            z-index: 20;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #ff3333;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font: bold 14px 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            padding: 0;
        }
        #turboFill {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 100%;
            background: rgba(255, 50, 50, 0.55);
            pointer-events: none;
        }
        #turbo span { position: relative; pointer-events: none; }
        #turbo.an { border-color: #fff; }
        #mute {
            position: absolute;
            top: calc(max(env(safe-area-inset-top), 20px) + 40px);
            right: 12px;
            z-index: 20;
            font-size: 22px;
            background: none;
            border: 0;
            padding: 4px 8px;
            cursor: pointer;
        }
        /* Lenkung: Knüppel im Bedienfeld, rückt dorthin, wo der Daumen aufsetzt; nur seitlich */
        #steerZone {
            position: relative;
            flex: 1 1 auto;
            align-self: stretch;
            touch-action: none;
        }
        #stickBase {
            position: absolute;
            width: 112px;
            height: 112px;
            margin: -56px 0 0 -56px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(36,40,51,.55) 0 58%, rgba(36,40,51,.8) 59%);
            border: 2px solid rgba(241,239,230,.4);
            pointer-events: none;
            box-sizing: border-box;
        }
        #stickBase.on { border-color: #f2b632; }
        #stickBase span {
            position: absolute; top: 50%; margin-top: -11px;
            font: bold 18px sans-serif; color: rgba(241,239,230,.75);
        }
        #stickBase .l { left: 9px; }
        #stickBase .r { right: 9px; }
        #stickKnob {
            position: absolute; left: 50%; top: 50%;
            width: 46px; height: 46px; margin: -23px 0 0 -23px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 34%, #ffd05a, #f2b632 55%, #c98f17);
            box-shadow: 0 4px 10px rgba(0,0,0,.45);
        }
    </style>
</head>
<body>

<div id="game"><canvas id="gameCanvas"></canvas>
    <div class="overlay" id="startScreen">
        <div class="big">AUTORENNEN</div>
        <button class="startBtn" id="btnStart" type="button">START</button>
        <div class="small">Unten Knüppel seitlich = lenken · TURBO halten = schneller</div>
    </div>
    <div class="overlay" id="gameOver" hidden>
        <div class="big">GAME OVER</div>
        <button class="startBtn" id="btnAgain" type="button">NOCHMAL</button>
    </div>
</div>
<div id="ui">SPEED: <span id="speedDisplay">0</span> km/h<br><span id="timeDisplay" class="red">TIME: 60</span></div>

<!-- Bedienfeld unten: links/Mitte lenken, rechts Turbo -->
<div id="panel">
    <div id="steerZone">
        <div id="stickBase"><span class="l">‹</span><span class="r">›</span><div id="stickKnob"></div></div>
    </div>
    <button id="turbo" type="button"><div id="turboFill"></div><span>TURBO</span></button>
</div>
<button id="mute" type="button" aria-label="Ton an/aus">🔊</button>
<button id="ver" type="button"></button>
<div class="update" id="update" hidden>
    <span id="update-text"></span>
    <button id="update-go" type="button">Jetzt laden</button>
</div>

<script>
const APP_VERSION = '2.2';          // bei JEDER Änderung hochzählen, nie zurück
</script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedDisplay = document.getElementById('speedDisplay');

// Bildschirmgröße anpassen
const gameEl = document.getElementById('game');
function resize() {
    const r = gameEl.getBoundingClientRect();
    canvas.width = Math.round(r.width);
    canvas.height = Math.round(r.height);
    try { stickHome(); } catch (_) {} // beim ersten Aufruf ist die Lenkung noch nicht angelegt
}
window.addEventListener('resize', resize);
resize();

// --- SPIELVARIABLEN ---
let position = 0; // Z-Position auf der Straße
let playerX = 0; // X-Position des Spielers (-1 bis 1)
let speed = 0; // Welt-Einheiten pro Sekunde (update() rechnet mit dt in Sekunden)
const segmentLength = 200;
const maxSpeed = segmentLength * 60; // 60 Segmente pro Sekunde
const accel = maxSpeed / 5;          // in 5 s auf Höchstgeschwindigkeit
const decel = maxSpeed;              // Bremse
const offRoadDecel = maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;   // im Gras nie langsamer als das, sonst bleibt man stecken
const centrifugal = 0.1;          // bei Vollgas in der engsten Kurve (curve 5) braucht man halben Einschlag

// Tastenstatus
let keys = { left: false, right: false, up: true, down: false };

// Touch-Steuerung: Knüppel im Bedienfeld
// Analoge Lenkung: steer von -1 (voll links) bis +1 (voll rechts).
// Maßgeblich ist der Abstand des Daumens zum Aufsetzpunkt; der Knüppel rückt dorthin.
let steer = 0;
const steerZone = document.getElementById('steerZone');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
let steerPtr = null, steerX0 = 0;
function steerRange() { return Math.max(60, Math.min(140, window.innerWidth * 0.22)); } // Fingerweg für Volleinschlag in px
function stickR() { return stickBase.offsetWidth / 2 || 85; }
function stickHome() {
    const r = steerZone.getBoundingClientRect();
    if (!r.width) return;
    const R = stickR();
    if (window.innerWidth > window.innerHeight) {          // Querformat: links unten, nicht über dem Auto
        stickBase.style.left = (R + 20) + 'px';
        stickBase.style.top = (r.height - R - 10) + 'px';
    } else {                                               // Hochformat: Mitte des Bedienfelds
        stickBase.style.left = (r.width / 2) + 'px';
        stickBase.style.top = (r.height / 2 - 2) + 'px';
    }
}
function steerMove(x) {
    const range = steerRange();
    const off = Math.max(-range, Math.min(range, x - steerX0));
    const a = off / range, m = Math.abs(a);
    steer = m < 0.08 ? 0 : Math.sign(a) * (m - 0.08) / 0.92; // kleine Totzone gegen Zittern
    stickKnob.style.transform = 'translateX(' + (a * (stickR() - 20)).toFixed(1) + 'px)';
}
function steerEnd(e) {
    if (e.pointerId !== steerPtr) return;
    steerPtr = null;
    steer = 0;
    stickKnob.style.transform = '';
    stickBase.classList.remove('on');
    stickHome();
}
steerZone.addEventListener('pointerdown', (e) => {
    if (steerPtr !== null) return;
    steerPtr = e.pointerId;
    try { steerZone.setPointerCapture(e.pointerId); } catch (x) {}
    const r = steerZone.getBoundingClientRect(), R = stickR();
    const cx = Math.max(R * 0.6, Math.min(r.width - R * 0.6, e.clientX - r.left));
    const cy = Math.max(R * 0.6, Math.min(r.height - R * 0.6, e.clientY - r.top));
    stickBase.style.left = cx + 'px';
    stickBase.style.top = cy + 'px';
    stickBase.classList.add('on');
    steerX0 = e.clientX;
    steerMove(e.clientX);
    e.preventDefault();
});
steerZone.addEventListener('pointermove', (e) => {
    if (e.pointerId === steerPtr) { steerMove(e.clientX); e.preventDefault(); }
});
steerZone.addEventListener('pointerup', steerEnd);
steerZone.addEventListener('pointercancel', steerEnd);
stickHome();

// --- TURBO ---
// Gedrückt halten: Höchsttempo x 1,4. Vorrat reicht 3 s, lädt in 10 s wieder voll.
const TURBO_FACTOR = 1.4;
let turboHeld = false, turboEnergy = 1, isTurbo = false;
const turboBtn = document.getElementById('turbo');
const turboFill = document.getElementById('turboFill');
let turboPtr = null;
turboBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    turboPtr = e.pointerId;
    try { turboBtn.setPointerCapture(e.pointerId); } catch (x) {}
    turboHeld = true;
});
function turboEnd(e) { if (e.pointerId === turboPtr) { turboPtr = null; turboHeld = false; } }
turboBtn.addEventListener('pointerup', turboEnd);
turboBtn.addEventListener('pointercancel', turboEnd);
turboBtn.addEventListener('lostpointercapture', turboEnd);

// --- MOTORSOUND (Web Audio) ---
// Startet erst bei der ersten Berührung: iOS spielt Ton nur nach einer Nutzeraktion.
let audioCtx = null, engineOsc1 = null, engineOsc2 = null, engineGain = null, engineFilter = null, noiseGain = null;
let muted = false;
try { muted = localStorage.getItem('autorennen.ton') === 'aus'; } catch (_) {}
const muteBtn = document.getElementById('mute');
// Symbol zeigt den echten Zustand: 🔇 aus, 🔈 an aber noch nicht freigegeben (einmal tippen), 🔊 läuft
function showSound() {
    const running = audioCtx && audioCtx.state === 'running';
    muteBtn.textContent = muted ? '🔇' : (running ? '🔊' : '🔈');
    muteBtn.style.opacity = (!muted && !running) ? '0.55' : '1';
}
showSound();
// iOS gibt Ton nur innerhalb einer echten Nutzeraktion frei (zuverlässig bei touchend/click, nicht immer
// bei pointerdown). Deshalb bei jeder Berührung: Kontext anlegen bzw. fortsetzen + einen stummen Ton spielen.
function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (audioCtx) {
        if (audioCtx.state !== 'running') { audioCtx.resume().then(showSound, () => {}); unlockBlip(); }
        return;
    }
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {} // Ton auch bei Stummschalter (Safari 17+)
    audioCtx = new AC();
    audioCtx.onstatechange = showSound;
    // Motor: Sägezahn + Rechteck eine Oktave tiefer, leicht verstimmt = vollerer Klang
    engineOsc1 = audioCtx.createOscillator();
    engineOsc2 = audioCtx.createOscillator();
    engineOsc1.type = 'sawtooth';
    engineOsc2.type = 'square';
    engineOsc2.detune.value = 15;
    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 400;
    engineFilter.Q.value = 5;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineOsc1.connect(engineFilter);
    engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    // Fahrtwind: Rauschen durch einen Bandpass, nur bei hohem Tempo hörbar
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buf;
    noiseSrc.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1000;
    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0;
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noiseSrc.start();
    engineOsc1.start();
    engineOsc2.start();
    unlockBlip();
    if (audioCtx.state !== 'running') audioCtx.resume().then(showSound, () => {});
    showSound();
}
function unlockBlip() {
    try {
        const b = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = b;
        src.connect(audioCtx.destination);
        src.start(0);
    } catch (_) {}
}
for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(ev, initAudio, true);
muteBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('autorennen.ton', muted ? 'aus' : 'an'); } catch (_) {}
    if (audioCtx) {                                    // sofort umschalten, nicht erst ausblenden
        const t = audioCtx.currentTime;
        for (const g of [engineGain, noiseGain]) { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(muted ? 0 : g.gain.value, t); }
    }
    showSound();
});
document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.visibilityState === 'visible') audioCtx.resume().then(showSound, () => {}); else audioCtx.suspend();
});
function updateAudio() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const s = speed / maxSpeed * 250;                  // auf die Skala der Vorlage umgerechnet (0..250, Turbo 350)
    const base = 40 + s * 0.6 + (isTurbo ? 30 : 0);
    engineOsc1.frequency.setTargetAtTime(base, t, 0.1);
    engineOsc2.frequency.setTargetAtTime(base * 0.5, t, 0.1);
    engineFilter.frequency.setTargetAtTime(200 + s * 1.5, t, 0.1);
    engineGain.gain.setTargetAtTime(muted ? 0 : (isTurbo ? 0.08 : 0.04), t, 0.1);
    noiseGain.gain.setTargetAtTime(muted ? 0 : Math.max(0, (s - 100) / 300) * 0.05, t, 0.1);
}

// Tastatur-Steuerung (für den PC-Test)
window.addEventListener('keydown', (e) => {
    if (e.key === 'Shift' || e.key === ' ') turboHeld = true;
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'ArrowUp') keys.up = true;
    if (e.key === 'ArrowDown') keys.down = true;
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift' || e.key === ' ') turboHeld = false;
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
    if (e.key === 'ArrowUp') keys.up = false;
    if (e.key === 'ArrowDown') keys.down = false;
});

// --- STRASSEN-GENERATOR (Pseudo-3D) ---
const rumbleLength = 3;
const roadWidth = 2000;
const lanes = 3;
let trackLength = 0;
let segments = [];

// Landschaften: 0 Wiese, 1 Wald, 2 Wüste, 3 Nacht
const THEMES = [
    { sky: ['#1E90FF', '#87CEEB'], sun: '#FFD700', mount: '#3a6ea5', grass: ['#00b300', '#00cc00'], base: '#004d00' },
    { sky: ['#1E90FF', '#87CEEB'], sun: '#FFD700', mount: '#2f5d50', grass: ['#004400', '#003300'], base: '#002a00' },
    { sky: ['#ffaa00', '#ffdd88'], sun: '#ff4500', mount: '#b5653a', grass: ['#d2b48c', '#c2a47c'], base: '#a88a60' },
    { sky: ['#050520', '#0b0b30'], sun: '#eeeeee', mount: '#16163a', grass: ['#111111', '#000000'], base: '#000000', night: true }
];
let currentTheme = 0;
function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
        index: n,
        p1: { world: { y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
        p2: { world: { y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
        curve: curve,
        theme: currentTheme,
        color: Math.floor(n / rumbleLength) % 2 ? 'dark' : 'light',
        sprites: []
    });
}
function lastY() { return (segments.length === 0) ? 0 : segments[segments.length - 1].p2.world.y; }

// Strecke bauen
function buildTrack() {
    segments = [];
    currentTheme = 0;
    addStraight(50); addCurve(50, 4); addHill(50, 200); addStraight(50);
    currentTheme = 1;
    addCurve(100, -5); addStraight(50); addHill(50, -100); addStraight(50);
    currentTheme = 2;
    addCurve(50, 6); addStraight(100); addCurve(50, -6); addStraight(50);
    currentTheme = 3;
    addCurve(100, 4); addStraight(100);
    trackLength = segments.length * segmentLength;
    // Randobjekte je Landschaft: Wiese Laubbäume + Büsche, Wald dichte Tannen, Wüste Kakteen + Felsen,
    // Nacht Straßenlaternen im festen Abstand. offset 1 = Straßenrand, Größe leicht zufällig.
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    for (let i = 8; i < segments.length - 8; i++) {
        const th = segments[i].theme;
        if (th === 3) {
            if (i % 8 === 0) segments[i].sprites.push({ type: 'lamp', offset: (i % 16 === 0 ? -1 : 1) * 1.15, scale: 1 });
            continue;
        }
        const every = th === 1 ? 3 : 4, chance = th === 1 ? 0.85 : 0.55;
        if (i % every !== 0 || Math.random() > chance) continue;
        const side = Math.random() > 0.5 ? 1 : -1;
        const type = th === 0 ? pick(['tree', 'tree', 'tree', 'bush', 'bush'])
                   : th === 1 ? pick(['fir', 'fir', 'fir', 'fir', 'bush'])
                   : pick(['cactus', 'cactus', 'rock', 'rock', 'rock']);
        const near = type === 'bush' || type === 'rock' ? 1.3 : 1.45;
        segments[i].sprites.push({ type, offset: side * (near + Math.random() * 0.5), scale: 0.8 + Math.random() * 0.5 });
    }
}
function addStraight(num) { for(let i=0; i<num; i++) addSegment(0, lastY()); }
function addCurve(num, curve) { for(let i=0; i<num; i++) addSegment(curve, lastY()); }
function addHill(num, height) {
    const startY = lastY();
    for(let i=0; i<num; i++) {
        let y = startY + Math.sin((i/num) * Math.PI) * height;
        addSegment(0, y);
    }
}
buildTrack();

// Kamera Einstellungen
const cameraHeight = 1000;
const cameraDepth = 1 / Math.tan((100 / 2) * Math.PI / 180);
const drawDistance = 150;

// --- GEGNER-AUTOS ---
const PLAYER_Z = 950;        // Abstand Kamera -> eigenes Auto (dort steht es unten im Bild)
const CAR_WORLD_W = 450;     // Breite eines Autos in Welt-Einheiten (Straße: 2 * roadWidth = 4000)
const OPP_COUNT = 28;
const OPP_COLORS = ['#1e5bd6', '#f2c200', '#ffffff', '#ff7a00', '#7a2bd6', '#1a1a1a', '#00a3a3'];
let opponents = [];
function resetOpponents() {
    opponents = [];
    for (let i = 0; i < OPP_COUNT; i++) {
        opponents.push({
            z: (i + 1) * trackLength / (OPP_COUNT + 1),                // gleichmäßig verteilt
            offset: [-0.6, 0, 0.6][i % 3] + (Math.random() - 0.5) * 0.2, // Spur: -1 linker, +1 rechter Rand
            speed: maxSpeed * (0.35 + Math.random() * 0.35),             // 35-70 % unseres Höchsttempos
            color: OPP_COLORS[i % OPP_COLORS.length]
        });
    }
}
resetOpponents();

// Sportwagen von hinten; x = Mitte, y = Unterkante, w = Breite in Pixeln
function drawCar(x, y, w, h, color, player = false) {
    if (player) { drawPlayerCar(x, y, w, h, color); return; }
    const l = x - w / 2, top = y - h;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';                         // Schatten
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.55, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;                                     // Karosserie (Trapez)
    ctx.beginPath();
    ctx.moveTo(l + w * 0.1, y);
    ctx.lineTo(l + w * 0.9, y);
    ctx.lineTo(l + w, top + h * 0.4);
    ctx.lineTo(l + w * 0.8, top);
    ctx.lineTo(l + w * 0.2, top);
    ctx.lineTo(l, top + h * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#222';                                    // Heckscheibe
    ctx.fillRect(l + w * 0.25, top + h * 0.1, w * 0.5, h * 0.3);
    if (w > 25) {                                              // Lüftungsgitter nur, wenn groß genug
        ctx.fillStyle = '#111';
        for (let i = 0; i < 4; i++) ctx.fillRect(l + w * 0.15, top + h * (0.5 + i * 0.09), w * 0.7, h * 0.045);
    }
    ctx.fillStyle = '#ff4d4d';                                 // Rücklichter
    ctx.fillRect(l + w * 0.1, top + h * 0.82, w * 0.2, h * 0.1);
    ctx.fillRect(l + w * 0.7, top + h * 0.82, w * 0.2, h * 0.1);
    ctx.fillStyle = '#000';                                    // Räder
    ctx.fillRect(l - w * 0.04, top + h * 0.6, w * 0.12, h * 0.4);
    ctx.fillRect(l + w * 0.92, top + h * 0.6, w * 0.12, h * 0.4);
}

// Eigenes Auto: Entwurf B „Keil-Sportler“ (Cabrio, Wahl des Nutzers 19.11.2026; Vorschau: autos.html)
const RED = '#d40000', RED_DARK = '#9e0000', RED_LIGHT = '#ff3b30';
function rrect(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function ell(x, y, rx, ry, c, a0 = 0, a1 = Math.PI * 2) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }

// Breite Reifen mit Profil, links/rechts außen
function tires(x, y, w, outer = 0.52, tw = 0.2, th = 0.3) {
  for (const s of [-1, 1]) {
    const tx = x + s * (outer - tw / 2) * w - tw * w / 2, ty = y - th * w;
    rrect(tx, ty, tw * w, th * w, tw * w * 0.2, '#111');
    rrect(tx + tw * w * 0.12, ty + th * w * 0.06, tw * w * 0.76, th * w * 0.86, 2, '#2c2c2c');
    ctx.fillStyle = '#0a0a0a';
    for (let g = 1; g < 5; g++) ctx.fillRect(tx + tw * w * 0.12, ty + th * w * g * 0.19, tw * w * 0.76, th * w * 0.05);
    ctx.fillStyle = '#3d3d3d';
    ctx.fillRect(s < 0 ? tx + tw * w * 0.02 : tx + tw * w * 0.86, ty + th * w * 0.1, tw * w * 0.12, th * w * 0.8);
  }
}
function shadow(x, y, w) { ell(x, y + w * 0.01, w * 0.6, w * 0.07, 'rgba(0,0,0,0.45)'); }

// Zwei Insassen ab Schulter; rim = Höhe der Cockpitkante. Haare der Beifahrerin wehen im Fahrtwind.
function occupants(x, rim, w, t, opt = {}) {
  const r = w * 0.085, dx = w * 0.17, hy = rim - w * 0.13;
  // Fahrer links
  ell(x - dx, rim + w * 0.01, r * 1.7, r * 1.1, opt.shirtL || '#2a4d9b', Math.PI, 0);
  circle(x - dx - r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx + r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx, hy, r, '#5a3418');
  circle(x - dx - r * 0.3, hy - r * 0.35, r * 0.35, '#7a4a26');
  if (opt.cap) { ell(x - dx, hy - r * 0.25, r * 1.05, r * 0.8, opt.cap, Math.PI, 0); }
  // Beifahrerin rechts: lange Haare, Spitzen wehen nach außen
  ell(x + dx, rim + w * 0.01, r * 1.6, r * 1.05, opt.shirtR || '#e8578f', Math.PI, 0);
  const wave = Math.sin(t * 9) * r * 0.25;
  ctx.fillStyle = '#f5c542';
  ctx.beginPath();
  ctx.moveTo(x + dx - r * 1.05, hy);
  ctx.quadraticCurveTo(x + dx - r * 1.3, hy + r * 1.3, x + dx - r * 0.6 + wave * 0.3, hy + r * 1.7);
  ctx.lineTo(x + dx + r * 1.5 + wave, hy + r * 1.4);
  ctx.quadraticCurveTo(x + dx + r * 1.4, hy + r * 0.4, x + dx + r * 1.0, hy);
  ctx.closePath(); ctx.fill();
  circle(x + dx, hy - r * 0.05, r * 1.05, '#f5c542');
  circle(x + dx - r * 0.3, hy - r * 0.4, r * 0.35, '#ffe08a');
  if (opt.ribbon) rrect(x + dx - r * 1.05, hy - r * 0.35, r * 2.1, r * 0.3, 2, opt.ribbon);
}

// ---------- B: Keil-Sportler (80er) ----------
// Flach und breit, Leuchtband über die ganze Breite, Entenbürzel-Spoiler, Diffusor, vier Endrohre.
function carB(x, y, w, t) {
  const bob = Math.sin(t * 22) * w * 0.004; y += bob;
  shadow(x, y, w);
  tires(x, y, w, 0.52, 0.21, 0.26);
  const rim = y - w * 0.33;
  occupants(x, rim, w, t, { shirtL: '#ffffff', shirtR: '#1b1b1b' });
  // Keil-Heck: oben schmaler
  poly([[x - w * 0.38, rim - w * 0.01], [x + w * 0.38, rim - w * 0.01], [x + w * 0.49, rim + w * 0.12],
        [x + w * 0.48, y - w * 0.05], [x - w * 0.48, y - w * 0.05], [x - w * 0.49, rim + w * 0.12]], RED);
  poly([[x - w * 0.4, rim - w * 0.04], [x + w * 0.4, rim - w * 0.04], [x + w * 0.42, rim], [x - w * 0.42, rim]], RED_DARK); // Spoilerlippe
  // Leuchtband
  rrect(x - w * 0.46, rim + w * 0.1, w * 0.92, w * 0.075, 2, '#140000');
  rrect(x - w * 0.44, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rrect(x + w * 0.19, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rrect(x - w * 0.17, rim + w * 0.13, w * 0.34, w * 0.012, 1, '#ff2a2a');
  // Diffusor mit Lamellen, vier Endrohre
  rrect(x - w * 0.36, y - w * 0.11, w * 0.72, w * 0.07, 2, '#151515');
  ctx.fillStyle = '#2a2a2a';
  for (let i = -2; i <= 2; i++) ctx.fillRect(x + i * w * 0.07 - w * 0.006, y - w * 0.11, w * 0.012, w * 0.07);
  for (const ex of [-0.3, -0.24, 0.24, 0.3]) { circle(x + ex * w, y - w * 0.07, w * 0.024, '#888'); circle(x + ex * w, y - w * 0.07, w * 0.015, '#111'); }
}

function drawPlayerCar(x, y, w, h, color) {
    carB(x, y, w, performance.now() / 1000);
}

// Randobjekte; x/y = Fußpunkt, size = halbe Straßenbreite in Pixeln an dieser Stelle
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function footShadow(x, y, w) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, y, w, w * 0.25, 0, 0, Math.PI * 2); ctx.fill(); }
function drawSprite(sp, x, y, size) {
    const s = size * (sp.scale || 1);
    switch (sp.type) {
    case 'tree': {                                     // Laubbaum: Stamm + drei Kronenbälle, Licht von links
        footShadow(x, y, s * 0.22);
        ctx.fillStyle = '#6b4423'; ctx.fillRect(x - s * 0.035, y - s * 0.42, s * 0.07, s * 0.42);
        ctx.fillStyle = '#4e3018'; ctx.fillRect(x, y - s * 0.42, s * 0.035, s * 0.42);
        circle(x - s * 0.13, y - s * 0.52, s * 0.17, '#1f6b2a');
        circle(x + s * 0.13, y - s * 0.54, s * 0.17, '#1a5c24');
        circle(x, y - s * 0.7, s * 0.2, '#237a30');
        circle(x - s * 0.06, y - s * 0.76, s * 0.09, '#3d9a45');   // Glanzlicht
        break;
    }
    case 'bush': {
        footShadow(x, y, s * 0.16);
        circle(x - s * 0.09, y - s * 0.07, s * 0.1, '#1d6626');
        circle(x + s * 0.09, y - s * 0.07, s * 0.1, '#185520');
        circle(x, y - s * 0.13, s * 0.12, '#25782e');
        circle(x - s * 0.04, y - s * 0.17, s * 0.05, '#3c9444');
        break;
    }
    case 'fir': {                                      // Tanne: drei gestufte Dreiecke, linke Hälfte heller
        footShadow(x, y, s * 0.18);
        ctx.fillStyle = '#4e3018'; ctx.fillRect(x - s * 0.03, y - s * 0.16, s * 0.06, s * 0.16);
        for (let k = 0; k < 3; k++) {
            const by = y - s * (0.12 + k * 0.2), half = s * (0.22 - k * 0.05), ty = by - s * 0.32;
            ctx.fillStyle = '#0f4a22';
            ctx.beginPath(); ctx.moveTo(x - half, by); ctx.lineTo(x + half, by); ctx.lineTo(x, ty); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#17642f';
            ctx.beginPath(); ctx.moveTo(x - half, by); ctx.lineTo(x, by); ctx.lineTo(x, ty); ctx.closePath(); ctx.fill();
        }
        break;
    }
    case 'cactus': {                                   // Säulenkaktus mit zwei Armen
        footShadow(x, y, s * 0.12);
        const w = s * 0.07;
        const col = '#2e8b3a', dark = '#226b2c';
        const pill = (px, py, pw, ph, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px, py, pw, ph, pw / 2) : ctx.rect(px, py, pw, ph); ctx.fill(); };
        pill(x - w / 2, y - s * 0.55, w, s * 0.55, col);
        pill(x - w * 1.9, y - s * 0.38, w * 0.8, s * 0.2, col);    // linker Arm hoch
        pill(x - w * 1.9, y - s * 0.24, w * 1.6, w * 0.7, col);     // linker Arm quer
        pill(x + w * 1.1, y - s * 0.46, w * 0.8, s * 0.22, col);   // rechter Arm hoch
        pill(x + w * 0.3, y - s * 0.3, w * 1.6, w * 0.7, col);      // rechter Arm quer
        pill(x + w * 0.1, y - s * 0.55, w * 0.35, s * 0.55, dark);  // Schattenseite
        break;
    }
    case 'rock': {                                     // Felsbrocken mit heller und dunkler Seite
        footShadow(x, y, s * 0.2);
        ctx.fillStyle = '#8a7660';
        ctx.beginPath();
        ctx.moveTo(x - s * 0.2, y); ctx.lineTo(x - s * 0.16, y - s * 0.12); ctx.lineTo(x - s * 0.05, y - s * 0.2);
        ctx.lineTo(x + s * 0.1, y - s * 0.17); ctx.lineTo(x + s * 0.2, y - s * 0.06); ctx.lineTo(x + s * 0.21, y);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#6b5a48';                     // Schattenseite rechts
        ctx.beginPath();
        ctx.moveTo(x + s * 0.02, y); ctx.lineTo(x + s * 0.02, y - s * 0.18); ctx.lineTo(x + s * 0.1, y - s * 0.17);
        ctx.lineTo(x + s * 0.2, y - s * 0.06); ctx.lineTo(x + s * 0.21, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#a8927a';                     // Kante oben links
        ctx.beginPath();
        ctx.moveTo(x - s * 0.16, y - s * 0.12); ctx.lineTo(x - s * 0.05, y - s * 0.2); ctx.lineTo(x - s * 0.02, y - s * 0.15); ctx.lineTo(x - s * 0.12, y - s * 0.09);
        ctx.closePath(); ctx.fill();
        break;
    }
    case 'lamp': {                                     // Straßenlaterne, Arm zeigt zur Straße, mit Lichtschein
        const dir = sp.offset > 0 ? -1 : 1, hgt = s * 0.9;
        ctx.fillStyle = '#555c66';
        ctx.fillRect(x - s * 0.015, y - hgt, s * 0.03, hgt);
        ctx.fillRect(Math.min(x, x + dir * s * 0.18), y - hgt, s * 0.18, s * 0.025);
        const lx = x + dir * s * 0.18, ly = y - hgt + s * 0.04;
        const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, s * 0.35);
        g.addColorStop(0, 'rgba(255, 230, 150, 0.55)');
        g.addColorStop(1, 'rgba(255, 230, 150, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(lx, ly, s * 0.35, 0, Math.PI * 2); ctx.fill();
        circle(lx, ly, s * 0.035, '#fff3c0');
        break;
    }
    }
}

// Staubwolken hinter den Hinterrädern: wandern nach hinten (zum Betrachter = im Bild nach unten) und
// nach außen, werden schnell größer und blasser. Auf Asphalt nur ein Hauch, im Gras/Sand kräftig.
// Werte in Pixeln pro Bild bei 60 Bildern/s, mit dt umgerechnet.
const dustParticles = [];
let prevDustSpeed = 0;
const DUST_RGB = ['150,140,110', '120,110,85', '215,185,140', '110,110,110'];   // je Landschaft
function updateDust(dt) {
    const k = dt * 60;
    for (let i = dustParticles.length - 1; i >= 0; i--) {
        const p = dustParticles[i];
        p.x += p.vx * k;
        p.y += p.vy * k;
        p.vx *= Math.pow(0.97, k);
        p.size += p.grow * k;
        p.alpha -= p.fade * k;
        if (p.alpha <= 0 || p.y - p.size > canvas.height) dustParticles.splice(i, 1);
    }
    const sp = speed / maxSpeed;
    const accelerating = speed > prevDustSpeed + 1;
    prevDustSpeed = speed;
    const offRoad = playerX < -1 || playerX > 1;
    // Asphalt: nur beim Anfahren (Tempo steigt und liegt unter 60 %), am stärksten direkt nach dem Start.
    // Gras/Sand: immer ab 15 % Tempo.
    const launch = !offRoad && accelerating && sp > 0.01 && sp < 0.6;
    if (dustParticles.length > 160 || !(launch || (offRoad && sp >= 0.15))) return;
    const seg = segments[Math.floor(position / segmentLength) % segments.length];
    const rgb = DUST_RGB[seg.theme];
    const carW = canvas.width * 0.2;
    const wheelY = canvas.height - 50;
    const rate = (offRoad ? 1.2 * sp : 1.6 * (1 - sp / 0.6)) * k;   // Teilchen je Rad und Bild
    for (const side of [-1, 1]) {
        let n = rate;
        while (n > 0) {
            if (Math.random() < Math.min(1, n)) {
                dustParticles.push(offRoad ? {                  // Gras/Sand: große Wolken, quellen seitlich weg
                    x: canvas.width / 2 + side * carW * 0.47,
                    y: wheelY - 2,
                    vx: side * (1.2 + Math.random() * 1.8) * sp,
                    vy: (0.6 + Math.random() * 1.2) * sp,
                    size: carW * (0.06 + Math.random() * 0.05),
                    grow: carW * 0.009,
                    alpha: 0.55,
                    fade: 0.016,
                    rgb
                } : {                                           // Asphalt: kleine Wölkchen, fliegen nach hinten weg
                    x: canvas.width / 2 + side * carW * (0.46 + Math.random() * 0.06),
                    y: wheelY,
                    vx: side * (0.4 + Math.random() * 0.9),
                    vy: (1.2 + Math.random() * 1.4) * (0.5 + sp),
                    size: carW * (0.03 + Math.random() * 0.025),
                    grow: carW * 0.004,
                    alpha: 0.65,
                    fade: 0.03,
                    rgb: '190,185,175'
                });
            }
            n -= 1;
        }
    }
}
function drawDust() {
    for (const p of dustParticles) {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        g.addColorStop(0, 'rgba(' + p.rgb + ',' + Math.max(0, p.alpha).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(' + p.rgb + ',0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Hintergrund: Himmelsverlauf, Sonne, Berge (wandern in Kurven seitlich mit)
let bgOffset = 0;
function drawBackground(theme) {
    const T = THEMES[theme];
    const W = canvas.width, H = canvas.height, hz = H / 2;
    const sky = ctx.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, T.sky[0]);
    sky.addColorStop(1, T.sky[1]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, hz + 2);
    if (T.night) {                                     // Sterne und Mond
        ctx.fillStyle = 'white';
        for (let i = 0; i < 20; i++) {                 // feste, gestreute Positionen (keine Diagonale)
            const fx = ((i * 0.618034) % 1), fy = ((i * i * 0.137 + i * 0.29) % 1);
            ctx.fillRect(fx * W, fy * H * 0.4, 2, 2);
        }
        ctx.fillStyle = T.sun;
        ctx.beginPath();
        ctx.arc(W * 0.8 - playerX * 80, H * 0.2, Math.min(40, W * 0.1), 0, Math.PI * 2);
        ctx.fill();
    } else {                                           // Sonne, wandert beim Lenken leicht gegen
        ctx.fillStyle = T.sun;
        ctx.beginPath();
        ctx.arc(W * 0.8 - playerX * 100, H * 0.3, Math.min(50, W * 0.12), 0, Math.PI * 2);
        ctx.fill();
    }
    const peaks = [0, 0.35, 0.12, 0.6, 0.25, 0.8, 0.4, 0.5, 0.15, 0.7, 0];  // Höhen relativ
    const span = W * 1.5, step = span / (peaks.length - 1);
    const off = ((bgOffset * W) % span + span) % span;
    ctx.fillStyle = T.mount;
    for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(k * span - off, hz + 1);
        peaks.forEach((p, i) => ctx.lineTo(k * span - off + i * step, hz - p * H * 0.12));
        ctx.lineTo(k * span - off + span, hz + 1);
        ctx.closePath();
        ctx.fill();
    }
}

// --- RENDERING FUNKTIONEN ---
function project(p, cameraX, cameraY, cameraZ) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((canvas.width/2) + (p.screen.scale * p.camera.x * canvas.width/2));
    p.screen.y = Math.round((canvas.height/2) - (p.screen.scale * p.camera.y * canvas.height/2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * canvas.width/2);
}

function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function render() {
    const baseSegment = Math.floor(position / segmentLength);
    const basePercent = (position % segmentLength) / segmentLength;
    const playerSegment = segments[baseSegment];
    drawBackground(playerSegment.theme);
    // Boden unter dem Horizont
    ctx.fillStyle = THEMES[playerSegment.theme].base;
    ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);
    
    // Spieler X-Position relativ zur Straße
    const playerZ = position;
    
    let maxy = canvas.height;
    let x = 0;
    let dx = -(playerSegment.curve * basePercent);

    // Straße zeichnen
    for(let n = 0; n < drawDistance; n++) {
        const segment = segments[(baseSegment + n) % segments.length];
        segment.looped = segment.index < baseSegment;
        segment.clip = maxy;
        segment.fog = 1 - (n / drawDistance);
        
        const cameraX = playerX * roadWidth - x;
        const cameraY = cameraHeight + (playerSegment.p1.world.y || 0); // Vereinfachte Kamera-Y
        // Segmente vom Streckenanfang, die am Rundenende schon sichtbar sind, liegen eine Runde weiter vorn
        const cameraZ = position - (segment.looped ? trackLength : 0);

        project(segment.p1, cameraX, cameraY, cameraZ);
        project(segment.p2, cameraX - dx, cameraY, cameraZ);

        x += dx;
        dx += segment.curve;

        // Nicht zeichnen, wenn hinter uns
        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxy) continue;

        const p1 = segment.p1.screen;
        const p2 = segment.p2.screen;

        // Gras / Rumble
        let grassColor = THEMES[segment.theme].grass[segment.color === 'light' ? 0 : 1];
        let rumbleColor = segment.color === 'light' ? '#ff0000' : '#ffffff';
        let roadColor = segment.color === 'light' ? '#555555' : '#666666';

        // Gras
        ctx.fillStyle = grassColor;
        ctx.fillRect(0, p2.y, canvas.width, p1.y - p2.y);

        // Rumble Strips
        const r1 = p1.w / 5;
        const r2 = p2.w / 5;
        drawPolygon(p1.x - p1.w - r1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w - r2, p2.y, rumbleColor); // Links
        drawPolygon(p1.x + p1.w + r1, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x + p2.w + r2, p2.y, rumbleColor); // Rechts

        // Straße
        drawPolygon(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, roadColor);

        // Fahrspuren
        if (segment.color === 'light') {
            const l1 = p1.w / 10;
            const l2 = p2.w / 10;
            const lw1 = p1.w / 40;
            const lw2 = p2.w / 40;
            // Linke Spur
            drawPolygon(p1.x - l1 - lw1, p1.y, p1.x - l1 + lw1, p1.y, p2.x - l2 + lw2, p2.y, p2.x - l2 - lw2, p2.y, '#ffffff');
            // Rechte Spur
            drawPolygon(p1.x + l1 - lw1, p1.y, p1.x + l1 + lw1, p1.y, p2.x + l2 + lw2, p2.y, p2.x + l2 - lw2, p2.y, '#ffffff');
        }

        maxy = p2.y;
    }

    // Gegner zeichnen: von hinten nach vorn, abgeschnitten an Kuppen
    const vis = [];
    for (const o of opponents) {
        let rel = o.z - position;
        if (rel < 0) rel += trackLength;
        if (rel < cameraDepth * 2 || rel >= (drawDistance - 1) * segmentLength) continue;
        const idx = Math.floor(o.z / segmentLength) % segments.length;
        const n = (idx - baseSegment + segments.length) % segments.length; // wie weit vor uns (Segmente)
        if (n >= drawDistance) continue;
        const seg = segments[idx];
        if (seg.p1.camera.z <= cameraDepth) continue;                       // hinter der Kamera
        vis.push({ o, rel, seg });
    }
    // Randobjekte der sichtbaren Segmente dazu, damit Nahes Fernes verdeckt
    for (let n = 1; n < drawDistance; n++) {
        const seg = segments[(baseSegment + n) % segments.length];
        if (!seg.sprites.length || seg.p1.camera.z <= cameraDepth) continue;
        const rel = n * segmentLength - (position % segmentLength);
        if (rel < 500) continue;                        // direkt an der Kamera: würde das halbe Bild zudecken
        for (const sp of seg.sprites) vis.push({ sp, rel, seg });
    }
    vis.sort((a, b) => b.rel - a.rel);
    for (const { o, sp, seg } of vis) {
        if (sp) {
            const a = seg.p1.screen;
            if (a.w < 2 || a.y - a.w * 1.4 >= seg.clip) continue;
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, canvas.width, seg.clip);
            ctx.clip();
            drawSprite(sp, a.x + a.w * sp.offset, a.y, a.w);
            ctx.restore();
            continue;
        }
        const t = (o.z % segmentLength) / segmentLength;
        const a = seg.p1.screen, b = seg.p2.screen;
        if (!(a.scale > 0)) continue;
        const sy = a.y + (b.y - a.y) * t;
        const sw = a.w + (b.w - a.w) * t;              // halbe Straßenbreite in Pixeln
        const sx = a.x + (b.x - a.x) * t + sw * o.offset;
        const w = sw * CAR_WORLD_W / roadWidth;
        const h = w * 0.6;
        if (w < 2 || sy - h >= seg.clip) continue;      // zu klein oder ganz hinter der Kuppe
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, seg.clip);
        ctx.clip();
        drawCar(sx, sy, w, h, o.color);
        ctx.restore();
    }

    // Turbo: Geschwindigkeitsstreifen
    if (isTurbo) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
            const lx = Math.random() * canvas.width, ly = Math.random() * canvas.height;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + 100 + Math.random() * 200);
            ctx.stroke();
        }
    }

    // Spieler-Auto: gleiche Zeichnung wie die Gegner, nur rot und vorn; wackelt im Turbo
    const carW = canvas.width * 0.2;              // entspricht CAR_WORLD_W im Abstand PLAYER_Z
    const shake = isTurbo ? (Math.random() - 0.5) * 5 : 0;
    drawDust();
    drawCar(canvas.width / 2 + shake, canvas.height - 50 + shake, carW, carW * 0.6, '#D40000', true);
}

// --- START, ZEIT UND NEUSTART ---
const TIME_LIMIT = 60;
let timeLeft = TIME_LIMIT, isGameOver = false, started = false;
const timeDisplay = document.getElementById('timeDisplay');
const gameOverScreen = document.getElementById('gameOver');
const startScreen = document.getElementById('startScreen');
const btnAgain = document.getElementById('btnAgain');
function resetGame() {
    buildTrack();
    resetOpponents();
    position = 0; playerX = 0; speed = 0;
    timeLeft = TIME_LIMIT; isGameOver = false;
    turboEnergy = 1;
    dustParticles.length = 0;
    gameOverScreen.hidden = true;
}
// Start: der Tipp auf den Knopf gibt gleichzeitig den Ton frei (iOS verlangt dafür eine Nutzeraktion)
function startRace() {
    initAudio();
    if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().then(showSound, () => {});
    started = true;
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
}
document.getElementById('btnStart').addEventListener('click', startRace);
btnAgain.addEventListener('click', () => { resetGame(); startRace(); });
for (const b of [document.getElementById('btnStart'), btnAgain]) b.addEventListener('pointerdown', (e) => e.stopPropagation());

// --- SPIEL-LOGIK ---
function update(dt) {
    if (!started || isGameOver) {
        speed = 0; isTurbo = false;
        speedDisplay.innerText = 0;
        updateDust(dt);
        updateAudio();
        return;
    }
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        isGameOver = true;
        gameOverScreen.hidden = false;
        btnAgain.disabled = true;                      // kurz sperren, damit ein Lenkfinger nicht sofort neu startet
        setTimeout(() => { btnAgain.disabled = false; }, 800);
        speed = 0;
    }
    timeDisplay.innerText = 'TIME: ' + Math.ceil(timeLeft);

    // Geschwindigkeit
    if (keys.up) {
        speed += accel * dt;
    } else if (keys.down) {
        speed -= decel * dt;
    } else {
        speed -= accel * dt * 0.5; // Motorbremsung
    }
    
    // Abbremsen auf Gras (off-road)
    if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
        speed -= offRoadDecel * dt;
    }

    // Turbo: nur mit Vorrat und erst ab etwas Tempo
    isTurbo = turboHeld && turboEnergy > 0 && speed > maxSpeed * 0.3;
    if (isTurbo) {
        speed += accel * dt;                             // zusätzlicher Schub
        turboEnergy = Math.max(0, turboEnergy - dt / 3);
    } else if (!turboHeld) {
        turboEnergy = Math.min(1, turboEnergy + dt / 10);
    }
    turboFill.style.height = (turboEnergy * 100).toFixed(0) + '%';
    turboBtn.classList.toggle('an', isTurbo);
    const topSpeed = isTurbo ? maxSpeed * TURBO_FACTOR : maxSpeed;

    // Limits: über dem Höchsttempo (nach dem Turbo) sanft abbremsen statt springen
    if (speed > topSpeed) speed = Math.max(topSpeed, speed - accel * dt * 2);
    if (speed < 0) speed = 0;

    // Position updaten
    position += speed * dt;
    while (position >= trackLength) {
        position -= trackLength;
    }

    // Gegner fahren mit eigenem Tempo; Auffahren bremst uns auf deren Tempo
    const myZ = (position + PLAYER_Z) % trackLength;
    for (const o of opponents) {
        o.z += o.speed * dt;
        while (o.z >= trackLength) o.z -= trackLength;
        let dz = o.z - myZ;
        if (dz < -trackLength / 2) dz += trackLength;
        if (dz > trackLength / 2) dz -= trackLength;
        // Abstand der Mitten < Autobreite (in Einheiten von playerX: 1 = halbe Straße = roadWidth)
        if (dz > -50 && dz < 250 && Math.abs(playerX - o.offset) < CAR_WORLD_W / roadWidth && speed > o.speed) {
            speed = o.speed * 0.8;
            position = (o.z - PLAYER_Z - 400 + trackLength) % trackLength; // hinter den Gegner zurücksetzen
            if (navigator.vibrate) navigator.vibrate(60);
        }
    }

    // Lenken
    const playerSegment = segments[Math.floor(position / segmentLength) % segments.length];
    const speedPercent = speed / maxSpeed;
    const dx = dt * 2 * speedPercent; // Lenkgeschwindigkeit
    bgOffset += playerSegment.curve * speedPercent * dt * 0.02;  // Berge wandern in Kurven

    let s = steer;
    if (keys.left) s = -1;
    else if (keys.right) s = 1;
    playerX += dx * s;
    
    // Zentrifugalkraft (zieht dich in Kurven nach außen)
    playerX -= (dx * speedPercent * playerSegment.curve * centrifugal);

    // Begrenzung der X-Position
    if (playerX < -2) playerX = -2;
    if (playerX > 2) playerX = 2;

    // UI Update
    speedDisplay.innerText = Math.floor(speed / maxSpeed * 300); // Fake km/h
    updateDust(dt);
    updateAudio();
}

// --- GAME LOOP ---
let lastTime = performance.now();
function gameLoop(time) {
    const dt = Math.min(1, (time - lastTime) / 1000); // Delta time in Sekunden
    lastTime = time;

    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// --- UPDATE-PRÜFUNG ---
const verEl = document.getElementById('ver');
const updateEl = document.getElementById('update');
verEl.textContent = 'v' + APP_VERSION;

let ausTimer = null, infoTimer = null;
function einblenden() {
    clearTimeout(ausTimer);
    updateEl.hidden = false; void updateEl.offsetWidth; // Reflow, sonst läuft der Übergang nicht an
    updateEl.classList.add('an');
}
function ausblenden() {
    updateEl.classList.remove('an'); clearTimeout(ausTimer);
    ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
}
// Graue Auskunft, verschwindet nach `sekunden` von selbst
function showInfo(text, sekunden = 2) {
    updateEl.className = 'update info';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = true;
    einblenden();
    clearTimeout(infoTimer);
    if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
// Grünes Banner mit Knopf
function zeigeBanner(text) {
    updateEl.className = 'update';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = false;
    einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
document.getElementById('update-go').addEventListener('click', () => location.reload());

let checking = false, announced = null;
async function checkForUpdate(manual = false) {
    if (checking) return;
    if (!manual && document.visibilityState !== 'visible') return;
    if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich'); return; }
    checking = true;
    try {
        const res = await fetch('index.html', { cache: 'no-store' });
        if (!res.ok) { if (manual) showInfo('Prüfung fehlgeschlagen'); return; }
        const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
        if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
        else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4);
    } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen'); }
    finally { checking = false; }
}
function announceUpdate(v, manual) {
    if (announced === v && !manual) return;
    announced = v;
    zeigeBanner('Neue Version ' + v + ' ist da');
    setTimeout(() => location.reload(), manual ? 1500 : 3000);
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
});
verEl.addEventListener('pointerdown', (e) => e.stopPropagation()); // Tipp auf die Nummer lenkt nicht
verEl.addEventListener('click', () => checkForUpdate(true));

// Nach einem Update einmal sagen, welche Fassung jetzt läuft
{
    const GESEHEN = 'autorennen.gesehen';
    let vorher = null;
    try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
    if (vorher !== APP_VERSION) {
        try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
        if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
    }
}

// Service Worker: eigene Dateien "Netz zuerst", damit Updates nicht im Cache hängen bleiben
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
