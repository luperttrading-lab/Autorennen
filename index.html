<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Diese Tags machen es zur Vollbild-App auf dem iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Autorennen</title>
    <style>
        /* Versionsnummer oben rechts: Tipp prüft auf Update */
        #ver {
            position: absolute;
            top: max(env(safe-area-inset-top), 20px);
            right: 16px;
            z-index: 20;
            padding: 6px 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            text-decoration: underline dotted;
            text-underline-offset: 4px;
            background: none;
            border: 0;
            font-family: inherit;
            cursor: pointer;
        }
        /* Update-Banner: liegt über dem Spiel (fixed), schiebt nichts */
        .update {
            position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #34c759; color: #06240e;
            padding: 12px 14px; border-radius: 14px; font-weight: 600; font-size: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5);
            opacity: 0; transition: opacity .35s ease; pointer-events: none;
        }
        .update.an { opacity: 1; pointer-events: auto; }
        .update[hidden] { display: none; }
        .update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
        .update button { padding: 8px 14px; font: 600 15px sans-serif; border: 0; border-radius: 9px; background: #06240e; color: #fff; cursor: pointer; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Himmelblau */
            touch-action: none; /* Verhindert Scrollen/Zoomen beim Spielen */
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: max(env(safe-area-inset-top), 20px);
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        /* Lenkung: Finger irgendwo aufsetzen und seitlich schieben */
        #steerZone {
            position: absolute;
            inset: 0;
            touch-action: none;
        }
        #steerBar {
            position: absolute;
            height: 56px;
            margin-top: -28px;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
            display: none;
        }
        #steerKnob {
            position: absolute;
            top: 50%;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
        }
        #hint {
            position: absolute;
            left: 0;
            right: 0;
            top: 100px;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui">SPEED: <span id="speedDisplay">0</span> km/h</div>

<!-- Touch-Steuerung: ganze Fläche, Finger seitlich schieben -->
<div id="steerZone"></div>
<div id="steerBar"><div id="steerKnob"></div></div>
<div id="hint">Finger aufsetzen und nach links / rechts schieben</div>
<button id="ver" type="button"></button>
<div class="update" id="update" hidden>
    <span id="update-text"></span>
    <button id="update-go" type="button">Jetzt laden</button>
</div>

<script>
const APP_VERSION = '1.3';          // bei JEDER Änderung hochzählen, nie zurück
</script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedDisplay = document.getElementById('speedDisplay');

// Bildschirmgröße anpassen
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- SPIELVARIABLEN ---
let position = 0; // Z-Position auf der Straße
let playerX = 0; // X-Position des Spielers (-1 bis 1)
let speed = 0; // Welt-Einheiten pro Sekunde (update() rechnet mit dt in Sekunden)
const segmentLength = 200;
const maxSpeed = segmentLength * 60; // 60 Segmente pro Sekunde
const accel = maxSpeed / 5;          // in 5 s auf Höchstgeschwindigkeit
const decel = maxSpeed;              // Bremse
const offRoadDecel = maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;   // im Gras nie langsamer als das, sonst bleibt man stecken
const centrifugal = 0.1;          // bei Vollgas in der engsten Kurve (curve 5) braucht man halben Einschlag

// Tastenstatus
let keys = { left: false, right: false, up: true, down: false };

// Touch-Steuerung
// Analoge Lenkung: steer von -1 (voll links) bis +1 (voll rechts).
// Maßgeblich ist der Abstand des Fingers zum Aufsetzpunkt, nicht die absolute Position.
let steer = 0;
const steerZone = document.getElementById('steerZone');
const steerBar = document.getElementById('steerBar');
const steerKnob = document.getElementById('steerKnob');
const hint = document.getElementById('hint');
let steerPtr = null, steerX0 = 0;
function steerRange() { return Math.max(60, Math.min(140, window.innerWidth * 0.22)); } // Fingerweg für Volleinschlag in px
function steerShow(x, y) {
    const r = steerRange();
    steerBar.style.left = (x - r - 28) + 'px';
    steerBar.style.top = y + 'px';
    steerBar.style.width = (2 * r + 56) + 'px';
    steerBar.style.display = 'block';
}
function steerMove(x) {
    const r = steerRange();
    const off = Math.max(-r, Math.min(r, x - steerX0));
    const a = off / r, m = Math.abs(a);
    steer = m < 0.08 ? 0 : Math.sign(a) * (m - 0.08) / 0.92; // kleine Totzone gegen Zittern
    steerKnob.style.left = (r + 28 + off) + 'px';
}
function steerEnd(e) {
    if (e.pointerId !== steerPtr) return;
    steerPtr = null;
    steer = 0;
    steerBar.style.display = 'none';
}
steerZone.addEventListener('pointerdown', (e) => {
    if (steerPtr !== null) return;
    steerPtr = e.pointerId;
    try { steerZone.setPointerCapture(e.pointerId); } catch (x) {}
    steerX0 = e.clientX;
    steerShow(e.clientX, e.clientY);
    steerMove(e.clientX);
    hint.style.opacity = 0;
    e.preventDefault();
});
steerZone.addEventListener('pointermove', (e) => {
    if (e.pointerId === steerPtr) { steerMove(e.clientX); e.preventDefault(); }
});
steerZone.addEventListener('pointerup', steerEnd);
steerZone.addEventListener('pointercancel', steerEnd);

// Tastatur-Steuerung (für den PC-Test)
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'ArrowUp') keys.up = true;
    if (e.key === 'ArrowDown') keys.down = true;
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
    if (e.key === 'ArrowUp') keys.up = false;
    if (e.key === 'ArrowDown') keys.down = false;
});

// --- STRASSEN-GENERATOR (Pseudo-3D) ---
const rumbleLength = 3;
const roadWidth = 2000;
const lanes = 3;
let trackLength = 0;
let segments = [];

function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
        index: n,
        p1: { world: { y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
        p2: { world: { y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
        curve: curve,
        color: Math.floor(n / rumbleLength) % 2 ? 'dark' : 'light'
    });
}
function lastY() { return (segments.length === 0) ? 0 : segments[segments.length - 1].p2.world.y; }

// Strecke bauen
function buildTrack() {
    segments = [];
    addStraight(50);
    addCurve(50, 5);
    addStraight(50);
    addCurve(50, -5);
    addHill(50, 100);
    addStraight(100);
    trackLength = segments.length * segmentLength;
}
function addStraight(num) { for(let i=0; i<num; i++) addSegment(0, lastY()); }
function addCurve(num, curve) { for(let i=0; i<num; i++) addSegment(curve, lastY()); }
function addHill(num, height) {
    const startY = lastY();
    for(let i=0; i<num; i++) {
        let y = startY + Math.sin((i/num) * Math.PI) * height;
        addSegment(0, y);
    }
}
buildTrack();

// Kamera Einstellungen
const cameraHeight = 1000;
const cameraDepth = 1 / Math.tan((100 / 2) * Math.PI / 180);
const drawDistance = 150;

// --- RENDERING FUNKTIONEN ---
function project(p, cameraX, cameraY, cameraZ) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((canvas.width/2) + (p.screen.scale * p.camera.x * canvas.width/2));
    p.screen.y = Math.round((canvas.height/2) - (p.screen.scale * p.camera.y * canvas.height/2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * canvas.width/2);
}

function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function render() {
    // Himmel
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height/2);
    // Gras
    ctx.fillStyle = '#004d00';
    ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);

    const baseSegment = Math.floor(position / segmentLength);
    const basePercent = (position % segmentLength) / segmentLength;
    const playerSegment = segments[baseSegment];
    
    // Spieler X-Position relativ zur Straße
    const playerZ = position;
    
    let maxy = canvas.height;
    let x = 0;
    let dx = -(playerSegment.curve * basePercent);

    // Straße zeichnen
    for(let n = 0; n < drawDistance; n++) {
        const segment = segments[(baseSegment + n) % segments.length];
        segment.looped = segment.index < baseSegment;
        segment.fog = 1 - (n / drawDistance);
        
        const cameraX = playerX * roadWidth - x;
        const cameraY = cameraHeight + (playerSegment.p1.world.y || 0); // Vereinfachte Kamera-Y
        // Segmente vom Streckenanfang, die am Rundenende schon sichtbar sind, liegen eine Runde weiter vorn
        const cameraZ = position - (segment.looped ? trackLength : 0);

        project(segment.p1, cameraX, cameraY, cameraZ);
        project(segment.p2, cameraX - dx, cameraY, cameraZ);

        x += dx;
        dx += segment.curve;

        // Nicht zeichnen, wenn hinter uns
        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxy) continue;

        const p1 = segment.p1.screen;
        const p2 = segment.p2.screen;

        // Gras / Rumble
        let grassColor = segment.color === 'light' ? '#00b300' : '#00cc00';
        let rumbleColor = segment.color === 'light' ? '#ff0000' : '#ffffff';
        let roadColor = segment.color === 'light' ? '#555555' : '#666666';

        // Gras
        ctx.fillStyle = grassColor;
        ctx.fillRect(0, p2.y, canvas.width, p1.y - p2.y);

        // Rumble Strips
        const r1 = p1.w / 5;
        const r2 = p2.w / 5;
        drawPolygon(p1.x - p1.w - r1, p1.y, p1.x - p1.w, p1.y, p2.x - p2.w, p2.y, p2.x - p2.w - r2, p2.y, rumbleColor); // Links
        drawPolygon(p1.x + p1.w + r1, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x + p2.w + r2, p2.y, rumbleColor); // Rechts

        // Straße
        drawPolygon(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, roadColor);

        // Fahrspuren
        if (segment.color === 'light') {
            const l1 = p1.w / 10;
            const l2 = p2.w / 10;
            const lw1 = p1.w / 40;
            const lw2 = p2.w / 40;
            // Linke Spur
            drawPolygon(p1.x - l1 - lw1, p1.y, p1.x - l1 + lw1, p1.y, p2.x - l2 + lw2, p2.y, p2.x - l2 - lw2, p2.y, '#ffffff');
            // Rechte Spur
            drawPolygon(p1.x + l1 - lw1, p1.y, p1.x + l1 + lw1, p1.y, p2.x + l2 + lw2, p2.y, p2.x + l2 - lw2, p2.y, '#ffffff');
        }

        maxy = p2.y;
    }

    // Spieler-Auto zeichnen (Einfaches rotes Rechteck als Platzhalter)
    const carW = canvas.width * 0.2;
    const carH = canvas.height * 0.15;
    const carX = (canvas.width / 2) - (carW / 2); // Auto bleibt mittig, die Straße wandert (Kamera folgt playerX)
    const carY = canvas.height - carH - 50;

    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, carY + carH, carW/2, carH/4, 0, 0, Math.PI*2);
    ctx.fill();

    // Auto Karosserie
    ctx.fillStyle = '#e60000'; // Ferrari Rot
    ctx.fillRect(carX, carY, carW, carH);
    // Fenster
    ctx.fillStyle = '#333';
    ctx.fillRect(carX + carW*0.1, carY + carH*0.1, carW*0.8, carH*0.4);
    // Räder
    ctx.fillStyle = '#111';
    ctx.fillRect(carX - 10, carY + carH*0.6, 15, carH*0.4);
    ctx.fillRect(carX + carW - 5, carY + carH*0.6, 15, carH*0.4);
}

// --- SPIEL-LOGIK ---
function update(dt) {
    // Geschwindigkeit
    if (keys.up) {
        speed += accel * dt;
    } else if (keys.down) {
        speed -= decel * dt;
    } else {
        speed -= accel * dt * 0.5; // Motorbremsung
    }
    
    // Abbremsen auf Gras (off-road)
    if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
        speed -= offRoadDecel * dt;
    }

    // Limits
    if (speed > maxSpeed) speed = maxSpeed;
    if (speed < 0) speed = 0;

    // Position updaten
    position += speed * dt;
    while (position >= trackLength) {
        position -= trackLength;
    }

    // Lenken
    const playerSegment = segments[Math.floor(position / segmentLength) % segments.length];
    const speedPercent = speed / maxSpeed;
    const dx = dt * 2 * speedPercent; // Lenkgeschwindigkeit

    let s = steer;
    if (keys.left) s = -1;
    else if (keys.right) s = 1;
    playerX += dx * s;
    
    // Zentrifugalkraft (zieht dich in Kurven nach außen)
    playerX -= (dx * speedPercent * playerSegment.curve * centrifugal);

    // Begrenzung der X-Position
    if (playerX < -2) playerX = -2;
    if (playerX > 2) playerX = 2;

    // UI Update
    speedDisplay.innerText = Math.floor(speed / maxSpeed * 300); // Fake km/h
}

// --- GAME LOOP ---
let lastTime = performance.now();
function gameLoop(time) {
    const dt = Math.min(1, (time - lastTime) / 1000); // Delta time in Sekunden
    lastTime = time;

    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// --- UPDATE-PRÜFUNG ---
const verEl = document.getElementById('ver');
const updateEl = document.getElementById('update');
verEl.textContent = 'v' + APP_VERSION;

let ausTimer = null, infoTimer = null;
function einblenden() {
    clearTimeout(ausTimer);
    updateEl.hidden = false; void updateEl.offsetWidth; // Reflow, sonst läuft der Übergang nicht an
    updateEl.classList.add('an');
}
function ausblenden() {
    updateEl.classList.remove('an'); clearTimeout(ausTimer);
    ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
}
// Graue Auskunft, verschwindet nach `sekunden` von selbst
function showInfo(text, sekunden = 2) {
    updateEl.className = 'update info';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = true;
    einblenden();
    clearTimeout(infoTimer);
    if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
// Grünes Banner mit Knopf
function zeigeBanner(text) {
    updateEl.className = 'update';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = false;
    einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
document.getElementById('update-go').addEventListener('click', () => location.reload());

let checking = false, announced = null;
async function checkForUpdate(manual = false) {
    if (checking) return;
    if (!manual && document.visibilityState !== 'visible') return;
    if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich'); return; }
    checking = true;
    try {
        const res = await fetch('index.html', { cache: 'no-store' });
        if (!res.ok) { if (manual) showInfo('Prüfung fehlgeschlagen'); return; }
        const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
        if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
        else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4);
    } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen'); }
    finally { checking = false; }
}
function announceUpdate(v, manual) {
    if (announced === v && !manual) return;
    announced = v;
    zeigeBanner('Neue Version ' + v + ' ist da');
    setTimeout(() => location.reload(), manual ? 1500 : 3000);
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
});
verEl.addEventListener('pointerdown', (e) => e.stopPropagation()); // Tipp auf die Nummer lenkt nicht
verEl.addEventListener('click', () => checkForUpdate(true));

// Nach einem Update einmal sagen, welche Fassung jetzt läuft
{
    const GESEHEN = 'autorennen.gesehen';
    let vorher = null;
    try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
    if (vorher !== APP_VERSION) {
        try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
        if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
    }
}

// Service Worker: eigene Dateien "Netz zuerst", damit Updates nicht im Cache hängen bleiben
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
