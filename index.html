<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Diese Tags machen es zur Vollbild-App auf dem iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Autorennen</title>
    <meta name="apple-mobile-web-app-title" content="Autorennen">
    <meta name="theme-color" content="#1b1550">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        /* Versionsnummer oben rechts: Tipp prüft auf Update */
        #ver {
            position: absolute;
            top: max(env(safe-area-inset-top), 20px);
            right: 16px;
            z-index: 20;
            padding: 6px 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            text-decoration: underline dotted;
            text-underline-offset: 4px;
            background: none;
            border: 0;
            font-family: inherit;
            cursor: pointer;
        }
        /* Update-Banner: liegt über dem Spiel (fixed), schiebt nichts */
        .update {
            position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #34c759; color: #06240e;
            padding: 12px 14px; border-radius: 14px; font-weight: 600; font-size: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5);
            opacity: 0; transition: opacity .35s ease; pointer-events: none;
        }
        .update.an { opacity: 1; pointer-events: auto; }
        .update[hidden] { display: none; }
        .update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
        .update button { padding: 8px 14px; font: 600 15px sans-serif; border: 0; border-radius: 9px; background: #06240e; color: #fff; cursor: pointer; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Himmelblau */
            touch-action: none; /* Verhindert Scrollen/Zoomen beim Spielen */
            -webkit-user-select: none; user-select: none;      /* langes Drücken markiert keinen Text */
            -webkit-touch-callout: none;                      /* kein Lupen-/Kopiermenü auf iOS */
            -webkit-tap-highlight-color: transparent;
            font-family: sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .red { color: #ff3333; }
        /* Start- und Ende-Bildschirm über dem Spielbild */
        .overlay {
            position: absolute; inset: 0; z-index: 15;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            color: white; font-family: 'Courier New', Courier, monospace; text-shadow: 3px 3px 0 #000; text-align: center;
        }
        .overlay[hidden] { display: none; }
        .overlay { gap: 10px; padding: 46px 10px 12px; box-sizing: border-box; overflow-y: auto; justify-content: safe center; }
        .overlay [hidden] { display: none; }
        .map svg { display: block; width: min(86vw, 320px); height: auto; max-height: 44vh; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
        #modeScreen { background: rgba(10, 8, 20, 0.88); z-index: 16; }
        .startBtn.alt { background: #2a6fd6; box-shadow: 0 6px 0 #123a7a, 0 10px 20px rgba(0,0,0,.4); }
        /* Leiste oben: Etappe, km, Fortschritt mit Checkpoint-Marken */
        #bar {
            position: absolute; z-index: 12; top: max(env(safe-area-inset-top), 14px); left: 12px; right: 64px;
            color: #fff; font: bold 13px 'Courier New', Courier, monospace; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
        }
        #bar { pointer-events: auto; cursor: pointer; }
        #miniMap { position: absolute; z-index: 13; left: 50%; top: calc(max(env(safe-area-inset-top), 14px) + 30px); transform: translateX(-50%);
            background: rgba(10, 8, 20, 0.82); border-radius: 12px; padding: 6px; pointer-events: none; opacity: 0; transition: opacity .25s; }
        #miniMap.an { opacity: 1; }
        #miniMap svg { display: block; width: min(60vw, 210px); height: auto; border-radius: 10px; }
        body.menu #bar, body.menu #ui { visibility: hidden; }
        #barTop { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
        #barName { overflow: hidden; text-overflow: ellipsis; }
        #barMode { color: #ffd84a; font-size: 11px; }
        #barTrack { position: relative; height: 7px; margin-top: 4px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.7); border-radius: 4px; overflow: hidden; }
        #barFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #ffd84a; }
        #barTrack i { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
        #msg {
            position: absolute; left: 0; right: 0; top: 26%; z-index: 14; text-align: center; pointer-events: none;
            color: #fff; font-family: 'Courier New', Courier, monospace; text-shadow: 3px 3px 0 #000;
            opacity: 0; transition: opacity .3s;
        }
        #msg.an { opacity: 1; }
        #count { position: absolute; left: 0; right: 0; top: 34%; z-index: 14; text-align: center; pointer-events: none;
            font: bold 120px 'Courier New', Courier, monospace; color: #fff; text-shadow: 5px 5px 0 #000; opacity: 0; }
        #count.an { animation: cnt 0.9s ease-out forwards; }
        #count.go { color: #7ddc6a; font-size: 90px; }
        @keyframes cnt { 0% { opacity: 0; transform: scale(1.8); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(0.9); } }
        #msg .t { font-size: 26px; font-weight: bold; padding: 0 8px; }
        #msg .s { font-size: 16px; margin-top: 6px; color: #ffe066; }
        .overlay .big { font-size: 40px; font-weight: bold; line-height: 1.1; }
        .overlay .small { font-size: 15px; opacity: .9; text-shadow: 1px 1px 0 #000; }
        .startBtn {
            font: bold 30px 'Courier New', Courier, monospace; letter-spacing: .08em;
            color: #fff; background: #d40000; border: 4px solid #fff; border-radius: 18px;
            padding: 14px 40px; box-shadow: 0 6px 0 #7a0000, 0 10px 20px rgba(0,0,0,.4);
            cursor: pointer; touch-action: manipulation;
        }
        .startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a0000; }
        .startBtn:disabled { opacity: .5; }
        /* Oben das Spielbild, unten das Bedienfeld (wie bei Passfahrt) */
        #game {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #panel {
            flex: 0 0 auto;
            position: relative;
            height: calc(108px + max(env(safe-area-inset-bottom), 4px));   /* Variante A (Nutzer 19.11.): flach, Knüppel am Rand */
            display: flex;
            align-items: center;
            gap: 12px;
            background: #242833;
            border-top: 3px solid #11131a;
            padding: 0 16px max(env(safe-area-inset-bottom), 4px) 0;
            box-sizing: border-box;
        }
        /* Knöpfe getauscht: Turbo links, Knüppel rechts */
        #panel.swap { flex-direction: row-reverse; padding-left: 16px; padding-right: 0; }
        #swap {
            position: absolute; left: 50%; margin-left: -15px; bottom: max(env(safe-area-inset-bottom), 4px); z-index: 21;
            width: 30px; height: 26px; padding: 0; border: 1px solid rgba(241,239,230,.35); border-radius: 8px;
            background: rgba(0,0,0,.3); color: rgba(241,239,230,.8); font: bold 15px sans-serif; touch-action: manipulation;
        }
        /* Querformat: Bedienfeld liegt durchsichtig über dem unteren Bildrand */
        @media (orientation: landscape) {
            #panel {
                position: absolute; left: 0; right: 0; bottom: 0;
                height: 50vh; max-height: none; min-height: 0;
                background: transparent; border-top: 0;
            }
        }
        #ui {
            position: absolute;
            top: calc(max(env(safe-area-inset-top), 14px) + 34px);
            left: 12px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none;
        }
        /* Turbo: kleiner runder Knopf unten rechts, Füllstand = Turbo-Vorrat */
        #turbo {
            position: relative;
            flex: 0 0 auto;
            z-index: 20;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #ff3333;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font: bold 14px 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            padding: 0;
        }
        #turboFill {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 100%;
            background: rgba(255, 50, 50, 0.55);
            pointer-events: none;
        }
        #turbo span { position: relative; pointer-events: none; }
        #turbo.an { border-color: #fff; }
        #mute {
            position: absolute;
            top: calc(max(env(safe-area-inset-top), 20px) + 40px);
            right: 12px;
            z-index: 20;
            font-size: 22px;
            background: none;
            border: 0;
            padding: 4px 8px;
            cursor: pointer;
        }
        /* Lenkung: Knüppel im Bedienfeld, rückt dorthin, wo der Daumen aufsetzt; nur seitlich */
        #steerZone {
            position: relative;
            flex: 1 1 auto;
            align-self: stretch;
            touch-action: none;
        }
        #stickBase {
            position: absolute;
            width: 100px;
            height: 100px;
            margin: -50px 0 0 -50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(36,40,51,.55) 0 58%, rgba(36,40,51,.8) 59%);
            border: 2px solid rgba(241,239,230,.4);
            pointer-events: none;
            box-sizing: border-box;
        }
        #stickBase.on { border-color: #f2b632; }
        #stickBase span {
            position: absolute; top: 50%; margin-top: -11px;
            font: bold 18px sans-serif; color: rgba(241,239,230,.75);
        }
        #stickBase .l { left: 9px; }
        #stickBase .r { right: 9px; }
        #stickBase .u, #stickBase .d { left: 0; right: 0; text-align: center; margin: 0; font: bold 9px sans-serif; letter-spacing: .05em; }
        #stickBase .u { top: 7px; color: #7ddc6a; }
        #stickBase .d { top: auto; bottom: 7px; color: #ff8a5c; }
        #stickKnob {
            position: absolute; left: 50%; top: 50%;
            width: 46px; height: 46px; margin: -23px 0 0 -23px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 34%, #ffd05a, #f2b632 55%, #c98f17);
            box-shadow: 0 4px 10px rgba(0,0,0,.45);
        }
    </style>
</head>
<body>

<div id="game"><canvas id="gameCanvas"></canvas>
    <div id="msg"><div class="t" id="msgT"></div><div class="s" id="msgS"></div></div>
    <div id="bar"><div id="barTop"><span id="barName"></span><span id="barMode"></span><span id="barKm"></span></div>
        <div id="barTrack"><div id="barFill"></div><i style="left:33.3%"></i><i style="left:66.7%"></i></div></div>
    <div id="miniMap"></div>
    <div id="count"></div>
    <div class="overlay" id="startScreen">
        <div class="big" id="startTitle">AUTORENNEN</div>
        <div class="map" id="startMap"></div>
        <div class="small" id="sammlung"></div>
        <button class="startBtn" id="btnStart" type="button">START</button>
        <div class="small" id="startHelp">An der Gabel in die Fahrbahn lenken · Restzeit zählt halb</div>
        <div class="small" id="trainHelp" hidden>Kein Game Over, keine Rekorde.<br>Tipp auf die Leiste oben: zurück zur Karte.</div>
    </div>
    <div class="overlay" id="modeScreen" hidden>
        <div class="big">MODUS</div>
        <button class="startBtn" id="btnRennen" type="button">RENNEN</button>
        <button class="startBtn alt" id="btnTraining" type="button">TRAINING</button>
        <div class="small">Training: Etappe auf der Karte frei wählen,<br>kein Game Over, keine Rekorde.</div>
    </div>
    <div class="overlay" id="gameOver" hidden>
        <div class="big" id="endTitle">GAME OVER</div>
        <div class="map" id="endMap"></div>
        <div class="small" id="goInfo"></div>
        <button class="startBtn" id="btnAgain" type="button">NOCHMAL</button>
    </div>
</div>
<div id="ui">SPEED: <span id="speedDisplay">0</span> km/h<br><span id="timeDisplay" class="red">TIME: 0</span></div>

<!-- Bedienfeld unten: links/Mitte lenken, rechts Turbo -->
<div id="panel">
    <div id="steerZone">
        <div id="stickBase"><span class="u">GAS</span><span class="d">BREMSE</span><span class="l">‹</span><span class="r">›</span><div id="stickKnob"></div></div>
    </div>
    <button id="turbo" type="button"><div id="turboFill"></div><span>TURBO</span></button>
    <button id="swap" type="button" aria-label="Knüppel und Turbo tauschen">⇄</button>
</div>
<button id="mute" type="button" aria-label="Ton an/aus">🔊</button>
<button id="ver" type="button"></button>
<div class="update" id="update" hidden>
    <span id="update-text"></span>
    <button id="update-go" type="button">Jetzt laden</button>
</div>

<script>
const APP_VERSION = '3.6';          // bei JEDER Änderung hochzählen, nie zurück
</script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedDisplay = document.getElementById('speedDisplay');

// Langes Drücken: kein Markieren, kein Kontextmenü
document.addEventListener('selectstart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

// Bildschirmgröße anpassen
const gameEl = document.getElementById('game');
function resize() {
    const r = gameEl.getBoundingClientRect();
    canvas.width = Math.round(r.width);
    canvas.height = Math.round(r.height);
    try { stickHome(); } catch (_) {} // beim ersten Aufruf ist die Lenkung noch nicht angelegt
}
window.addEventListener('resize', resize);
resize();

// --- SPIELVARIABLEN ---
let position = 0; // Z-Position auf der Straße
let playerX = 0; // X-Position des Spielers (-1 bis 1)
let speed = 0; // Welt-Einheiten pro Sekunde (update() rechnet mit dt in Sekunden)
const segmentLength = 200;
const maxSpeed = segmentLength * 60; // 60 Segmente pro Sekunde
const accel = maxSpeed / 5;          // in 5 s auf Höchstgeschwindigkeit
const decel = maxSpeed;              // Bremse
const offRoadDecel = maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;   // im Gras nie langsamer als das, sonst bleibt man stecken
const centrifugal = 0.1;          // bei Vollgas in der engsten Kurve (curve 5) braucht man halben Einschlag

// Tastenstatus
let keys = { left: false, right: false, up: false, down: false };
let throttle = 0, brake = 0;                          // vom Knüppel: 0..1
let slipTime = 0;                                     // > 0: Auto rutscht auf Öl

// Touch-Steuerung: Knüppel im Bedienfeld
// Analoge Lenkung: steer von -1 (voll links) bis +1 (voll rechts).
// Maßgeblich ist der Abstand des Daumens zum Aufsetzpunkt; der Knüppel rückt dorthin.
let steer = 0;
const steerZone = document.getElementById('steerZone');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
let steerPtr = null, steerX0 = 0, steerY0 = 0;
// Knöpfe tauschen (kleiner Knopf unten links): Knüppel und Turbo wechseln die Seite, wird gemerkt
let swapped = false;
try { swapped = localStorage.getItem('autorennen.tausch') === 'ja'; } catch (_) {}
const panelEl = document.getElementById('panel'), swapBtn = document.getElementById('swap');
panelEl.classList.toggle('swap', swapped);
swapBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
swapBtn.addEventListener('click', () => {
    swapped = !swapped;
    panelEl.classList.toggle('swap', swapped);
    try { localStorage.setItem('autorennen.tausch', swapped ? 'ja' : 'nein'); } catch (_) {}
    stickHome();
});
function steerRange() { return 50; } // Fingerweg für Volleinschlag in px: kurz, weil der Knüppel am Rand sitzt (bis v3.5: 22 % der Breite)
function stickR() { return stickBase.offsetWidth / 2 || 85; }
function stickHome() {
    const r = steerZone.getBoundingClientRect();
    if (!r.width) return;
    const R = stickR();
    if (window.innerWidth > window.innerHeight) {          // Querformat: unten in der Ecke, nicht über dem Auto
        stickBase.style.left = (swapped ? r.width - R - 20 : R + 20) + 'px';
        stickBase.style.top = (r.height - R - 10) + 'px';
    } else {                                               // Hochformat: am äußeren Rand, ganz unten im Bedienfeld
        stickBase.style.left = (swapped ? r.width - R - 12 : R + 12) + 'px';
        stickBase.style.top = (r.height - R - 2) + 'px';
    }
}
function steerMove(x, y) {
    const range = steerRange();
    const off = Math.max(-range, Math.min(range, x - steerX0));
    const a = off / range, m = Math.abs(a);
    steer = m < 0.08 ? 0 : Math.sign(a) * (m - 0.08) / 0.92; // kleine Totzone gegen Zittern
    // senkrecht: nach vorn (oben) = Gas, zurück (unten) = Bremse; Vollausschlag nach 60 % des Seitenwegs
    const vr = 30;                                     // Gas/Bremse: voller Ausschlag 30 px über/unter der Knüppelmitte
    const b = Math.max(-1, Math.min(1, -(y - steerY0) / vr)), mb = Math.abs(b);
    const v = mb < 0.12 ? 0 : Math.sign(b) * (mb - 0.12) / 0.88;
    throttle = Math.max(0, v); brake = Math.max(0, -v);
    let kx = a * (stickR() - 20), ky = -b * (stickR() - 20);
    const L = Math.hypot(kx, ky), maxL = stickR() - 20;
    if (L > maxL) { kx *= maxL / L; ky *= maxL / L; }
    stickKnob.style.transform = 'translate(' + kx.toFixed(1) + 'px,' + ky.toFixed(1) + 'px)';
}
function steerEnd(e) {
    if (e.pointerId !== steerPtr) return;
    steerPtr = null;
    steer = 0; throttle = 0; brake = 0;
    stickKnob.style.transform = '';
    stickBase.classList.remove('on');
    stickHome();
}
steerZone.addEventListener('pointerdown', (e) => {
    if (steerPtr !== null) return;
    steerPtr = e.pointerId;
    try { steerZone.setPointerCapture(e.pointerId); } catch (x) {}
    // Knüppel steht fest (Nutzer 19.11.): maßgeblich ist, wo der Finger relativ zur Knüppelmitte liegt –
    // links/rechts lenkt, oberhalb Gas, unterhalb Bremse, schon beim Aufsetzen
    const kb = stickBase.getBoundingClientRect();
    stickBase.classList.add('on');
    steerX0 = kb.left + kb.width / 2; steerY0 = kb.top + kb.height / 2;
    steerMove(e.clientX, e.clientY);
    e.preventDefault();
});
steerZone.addEventListener('pointermove', (e) => {
    if (e.pointerId === steerPtr) { steerMove(e.clientX, e.clientY); e.preventDefault(); }
});
steerZone.addEventListener('pointerup', steerEnd);
steerZone.addEventListener('pointercancel', steerEnd);
stickHome();

// --- TURBO ---
// Gedrückt halten: Höchsttempo x 1,4. Vorrat reicht 3 s, lädt in 10 s wieder voll.
const TURBO_FACTOR = 1.4;
let turboHeld = false, turboEnergy = 1, isTurbo = false;
const turboBtn = document.getElementById('turbo');
const turboFill = document.getElementById('turboFill');
let turboPtr = null;
turboBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    turboPtr = e.pointerId;
    try { turboBtn.setPointerCapture(e.pointerId); } catch (x) {}
    turboHeld = true;
});
function turboEnd(e) { if (e.pointerId === turboPtr) { turboPtr = null; turboHeld = false; } }
turboBtn.addEventListener('pointerup', turboEnd);
turboBtn.addEventListener('pointercancel', turboEnd);
turboBtn.addEventListener('lostpointercapture', turboEnd);

// --- MOTORSOUND (Web Audio) ---
// Startet erst bei der ersten Berührung: iOS spielt Ton nur nach einer Nutzeraktion.
let squealGains = null, squealType = 'B', squealAmt = 0, gravelGain = null, gravelAmt = 0;
let audioCtx = null, engineOsc1 = null, engineOsc2 = null, engineGain = null, engineFilter = null, noiseGain = null;
let muted = false;
try { muted = localStorage.getItem('autorennen.ton') === 'aus'; } catch (_) {}
const muteBtn = document.getElementById('mute');
// Symbol zeigt den echten Zustand: 🔇 aus, 🔈 an aber noch nicht freigegeben (einmal tippen), 🔊 läuft
function showSound() {
    const running = audioCtx && audioCtx.state === 'running';
    muteBtn.textContent = muted ? '🔇' : (running ? '🔊' : '🔈');
    muteBtn.style.opacity = (!muted && !running) ? '0.55' : '1';
}
showSound();
// iOS gibt Ton nur innerhalb einer echten Nutzeraktion frei (zuverlässig bei touchend/click, nicht immer
// bei pointerdown). Deshalb bei jeder Berührung: Kontext anlegen bzw. fortsetzen + einen stummen Ton spielen.
function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (audioCtx) {
        if (audioCtx.state !== 'running') { audioCtx.resume().then(showSound, () => {}); unlockBlip(); }
        return;
    }
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {} // Ton auch bei Stummschalter (Safari 17+)
    audioCtx = new AC();
    audioCtx.onstatechange = showSound;
    // Motor: Sägezahn + Rechteck eine Oktave tiefer, leicht verstimmt = vollerer Klang
    engineOsc1 = audioCtx.createOscillator();
    engineOsc2 = audioCtx.createOscillator();
    engineOsc1.type = 'sawtooth';
    engineOsc2.type = 'square';
    engineOsc2.detune.value = 15;
    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 400;
    engineFilter.Q.value = 5;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineOsc1.connect(engineFilter);
    engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    // Fahrtwind: Rauschen durch einen Bandpass, nur bei hohem Tempo hörbar
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buf;
    noiseSrc.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1000;
    noiseGain = audioCtx.createGain();

function climatePath(a, b) {                           // kürzester Weg im Klima-Graphen (Breitensuche)

        const n = q.shift();
        for (const m of CLIMATE[n]) if (!(m in prev)) { prev[m] = n; if (m === b) q.length = 0; else q.push(m); }
    }
    const path = [b];
    while (prev[path[0]] !== null && path[0] !== a) path.unshift(prev[path[0]]);
    return path;
}

            seg.sprites.push({ type: 'bush', offset: lo - 1.3, scale: 0.75, v: i % 2 }, { type: 'bush', offset: hi + 1.3, scale: 0.75, v: (i + 1) % 2 });

        const sp = D.spr;

function appendStage(id, fromLand, startSeg = null, sim = false) {

    curLand = curLand2 = st.land; curMix = 0;
    const final = st.row === ROWS - 1;
    genBody(st, STAGE_SEGS - (segments.length - startSeg) - (final ? PRE_FINAL : PRE + SPLIT), r);
    const S = { id, row: st.row, col: st.col, startSeg, final, nextCp: 0, signShown: false };
    if (final) {

    }

    for (const c of S.cps) segments[c].gates = [{ o: 0, kind: 'cp' }];
    if (ownHead) {                                     // Startlinie

        segments[startSeg + 8].gates = [{ o: 0, kind: 'start' }];

    const nOil = [3, 5, 6][st.col];                    // Ölflecken an festen Stellen
    for (let i = 0; i < nOil; i++) {

        paint(decoFrom, segments.length);

function spawnOpponents(st, a, b, r) {
    const n = Math.max(0, Math.round((b - a) / 45)), lo = Math.min(0.55, 0.35 + st.row * 0.03);   // je Reihe 3 Prozentpunkte schneller
    for (let i = 0; i < n; i++) opponents.push({

        speed: maxSpeed * (lo + r() * 0.35),

// Sportwagen von hinten; x = Mitte, y = Unterkante, w = Breite in Pixeln
function drawCar(x, y, w, h, color, player = false) {
    if (player) { drawPlayerCar(x, y, w, h, color); return; }
    const l = x - w / 2, top = y - h;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';                         // Schatten
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.55, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;                                     // Karosserie (Trapez)
    ctx.beginPath();
    ctx.moveTo(l + w * 0.1, y);
    ctx.lineTo(l + w * 0.9, y);
    ctx.lineTo(l + w, top + h * 0.4);
    ctx.lineTo(l + w * 0.8, top);
    ctx.lineTo(l + w * 0.2, top);
    ctx.lineTo(l, top + h * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#222';                                    // Heckscheibe
    ctx.fillRect(l + w * 0.25, top + h * 0.1, w * 0.5, h * 0.3);
    if (w > 25) {                                              // Lüftungsgitter nur, wenn groß genug
        ctx.fillStyle = '#111';
        for (let i = 0; i < 4; i++) ctx.fillRect(l + w * 0.15, top + h * (0.5 + i * 0.09), w * 0.7, h * 0.045);
    }
    ctx.fillStyle = '#ff4d4d';                                 // Rücklichter
    ctx.fillRect(l + w * 0.1, top + h * 0.82, w * 0.2, h * 0.1);
    ctx.fillRect(l + w * 0.7, top + h * 0.82, w * 0.2, h * 0.1);
    ctx.fillStyle = '#000';                                    // Räder
    ctx.fillRect(l - w * 0.04, top + h * 0.6, w * 0.12, h * 0.4);
    ctx.fillRect(l + w * 0.92, top + h * 0.6, w * 0.12, h * 0.4);
}

// Eigenes Auto: Entwurf B „Keil-Sportler“ (Cabrio, Wahl des Nutzers 19.11.2026; Vorschau: autos.html)

// Breite Reifen mit Profil, links/rechts außen
function tires(x, y, w, outer = 0.52, tw = 0.2, th = 0.3) {
  for (const s of [-1, 1]) {

    rrect(tx, ty, tw * w, th * w, tw * w * 0.2, '#111');
    rrect(tx + tw * w * 0.12, ty + th * w * 0.06, tw * w * 0.76, th * w * 0.86, 2, '#2c2c2c');

}

// Zwei Insassen ab Schulter; rim = Höhe der Cockpitkante. Haare der Beifahrerin wehen im Fahrtwind.
function occupants(x, rim, w, t, opt = {}) {
  const r = w * 0.085, dx = w * 0.17, hy = rim - w * 0.13;
  // Fahrer links
  ell(x - dx, rim + w * 0.01, r * 1.7, r * 1.1, opt.shirtL || '#2a4d9b', Math.PI, 0);
  circle(x - dx - r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx + r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx, hy, r, '#5a3418');
  circle(x - dx - r * 0.3, hy - r * 0.35, r * 0.35, '#7a4a26');
  if (opt.cap) { ell(x - dx, hy - r * 0.25, r * 1.05, r * 0.8, opt.cap, Math.PI, 0); }
  // Beifahrerin rechts: lange Haare, Spitzen wehen nach außen
  ell(x + dx, rim + w * 0.01, r * 1.6, r * 1.05, opt.shirtR || '#e8578f', Math.PI, 0);
  const wave = Math.sin(t * 9) * r * 0.25;
  ctx.fillStyle = '#f5c542';
  ctx.beginPath();
  ctx.moveTo(x + dx - r * 1.05, hy);
  ctx.quadraticCurveTo(x + dx - r * 1.3, hy + r * 1.3, x + dx - r * 0.6 + wave * 0.3, hy + r * 1.7);
  ctx.lineTo(x + dx + r * 1.5 + wave, hy + r * 1.4);
  ctx.quadraticCurveTo(x + dx + r * 1.4, hy + r * 0.4, x + dx + r * 1.0, hy);
  ctx.closePath(); ctx.fill();
  circle(x + dx, hy - r * 0.05, r * 1.05, '#f5c542');
  circle(x + dx - r * 0.3, hy - r * 0.4, r * 0.35, '#ffe08a');
  if (opt.ribbon) rrect(x + dx - r * 1.05, hy - r * 0.35, r * 2.1, r * 0.3, 2, opt.ribbon);
}

}

const MOUNT = {

function mountainLayer(tw, th, seed, minH, maxH, cols, snow, trees, freqs) {

    const comps = freqs.map((k, i) => ({ k, a: (0.6 + r() * 0.4) / Math.pow(k, 0.7), ph: r() * Math.PI * 2 }));
    const hs = [];

        hs.push(v); lo = Math.min(lo, v); hi = Math.max(hi, v);

        const lit = slope > 1, flat = Math.abs(slope) <= 1;

        for (let y = top; y < th; y++) {
            let col = lit ? rgb[0] : (flat ? rgb[1] : rgb[2]);
            if (((x + y) & 1) && r() < 0.12) col = rgb[1];       // Körnung
            if (y - top < snowDepth) col = sn;
            if (tr && y - top < 3 && y - top >= 0 && (x % 4 === 0 || x % 4 === 1) && r() < 0.6) col = tr;   // Baumsaum

}

// Staubwolken hinter den Hinterrädern: wandern nach hinten (zum Betrachter = im Bild nach unten) und
// nach außen, werden schnell größer und blasser. Auf Asphalt nur ein Hauch, im Gras/Sand kräftig.
// Werte in Pixeln pro Bild bei 60 Bildern/s, mit dt umgerechnet.
const dustParticles = [];

function updateDust(dt) {
    const k = dt * 60;

        const p = dustParticles[i];
        p.x += p.vx * k;
        p.y += p.vy * k;
        p.vx *= Math.pow(0.97, k);
        p.size += p.grow * k;
        p.alpha -= p.fade * k;
        if (p.alpha <= 0 || p.y - p.size > canvas.height) dustParticles.splice(i, 1);
    }
    const sp = speed / maxSpeed;
    const accelerating = speed > prevDustSpeed + 1;
    prevDustSpeed = speed;
    const seg = segAt(position + PLAYER_Z);
    const offRoad = roadDist(seg, playerX) > 1;
    // Asphalt: nur beim Anfahren (Tempo steigt und liegt unter 60 %), am stärksten direkt nach dem Start.
    // Gras/Sand: immer ab 15 % Tempo.
    const gravel = seg.gravel && !offRoad;
    const launch = !offRoad && !gravel && accelerating && sp > 0.01 && sp < 0.6;
    if (dustParticles.length > 160 || !(launch || ((offRoad || gravel) && sp >= 0.15))) return;
    const rgb = gravel ? '160,145,120' : LANDS[seg.mix < 0.5 ? seg.land : seg.land2].dust;
    const carW = canvas.width * 0.2;
    const wheelY = canvas.height - 50;
    const rate = (offRoad ? 1.2 * sp : gravel ? 0.8 * sp : 1.6 * (1 - sp / 0.6)) * k;   // Teilchen je Rad und Bild
    for (const side of [-1, 1]) {
        let n = rate;
        while (n > 0) {
            if (Math.random() < Math.min(1, n)) {
                dustParticles.push(offRoad || gravel ? {                  // Gras/Sand: große Wolken, quellen seitlich weg
                    x: canvas.width / 2 + side * carW * 0.47,
                    y: wheelY - 2,
                    vx: side * (1.2 + Math.random() * 1.8) * sp,
                    vy: (0.6 + Math.random() * 1.2) * sp,
                    size: carW * (0.06 + Math.random() * 0.05),
                    grow: carW * 0.009,
                    alpha: 0.55,
                    fade: 0.016,
                    rgb
                } : {                                           // Asphalt: kleine Wölkchen, fliegen nach hinten weg
                    x: canvas.width / 2 + side * carW * (0.46 + Math.random() * 0.06),
                    y: wheelY,
                    vx: side * (0.4 + Math.random() * 0.9),
                    vy: (1.2 + Math.random() * 1.4) * (0.5 + sp),
                    size: carW * (0.03 + Math.random() * 0.025),
                    grow: carW * 0.004,
                    alpha: 0.65,
                    fade: 0.03,
                    rgb: '190,185,175'

            }
            n -= 1;
        }
    }

function drawDust() {
    for (const p of dustParticles) {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        g.addColorStop(0, 'rgba(' + p.rgb + ',' + Math.max(0, p.alpha).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(' + p.rgb + ',0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

// Läuft über die ganze Fahrt: Position P = Reihe + Fortschritt in der Etappe (0 Morgen … 5 Ende der Nacht).
// tint = Lichtfarbe, die über die Landschaft gelegt wird (Farbe + Deckkraft); night = Sterne/Mond; dark = Laternen leuchten
const TOD = [

    { p: 2.5, top: '#1e90ff', bot: '#87ceeb', tint: [255, 255, 255, 0],   sunY: 0.14, sun: '#ffd700', night: 0, dark: 0 },
    { p: 3.0, top: '#3a82d6', bot: '#b8d8f2', tint: [255, 200, 120, 0.06], sunY: 0.22, sun: '#ffd54a', night: 0, dark: 0 },
    { p: 3.7, top: '#4c4a96', bot: '#ff9a58', tint: [255, 120, 60, 0.2], sunY: 0.40, sun: '#ff6a2a', night: 0, dark: 0.1 },
    { p: 4.1, top: '#23285e', bot: '#b8607a', tint: [60, 40, 110, 0.38],  sunY: 0.53, sun: '#ff4a2a', night: 0.45, dark: 0.55 },
    { p: 4.5, top: '#060722', bot: '#141846', tint: [10, 14, 48, 0.62],   sunY: 0.70, sun: '#ff4a2a', night: 1, dark: 1 },
    { p: 9.0, top: '#060722', bot: '#141846', tint: [10, 14, 48, 0.62],   sunY: 0.70, sun: '#ff4a2a', night: 1, dark: 1 }

function timeOfDay(P) {
    let i = 0;
    while (i < TOD.length - 2 && P > TOD[i + 1].p) i++;
    const a = TOD[i], b = TOD[i + 1], t = Math.max(0, Math.min(1, (P - a.p) / (b.p - a.p)));
    const L = (x, y) => x + (y - x) * t;
    return {
        top: rgbStr(mixRgb(a.top, b.top, t)), bot: rgbStr(mixRgb(a.bot, b.bot, t)), sun: rgbStr(mixRgb(a.sun, b.sun, t)),
        tint: a.tint.map((v, k) => k < 3 ? Math.round(L(v, b.tint[k])) : L(v, b.tint[k])),
        sunY: L(a.sunY, b.sunY), night: L(a.night, b.night), dark: L(a.dark, b.dark)

// Hintergrund: ferne Berge der Landschaft (im Übergang zwei überblendet), wachsen vor dem Gebirge
let bgOffset = 0;
function drawMountains(seg, W, H) {
    const hz = H / 2, ahead = segAt(seg.p1.world.z + 150 * segmentLength);
    const msc = Math.max(0.6, ((seg.msc || 1) + (ahead.msc || 1)) / 2);
    ctx.imageSmoothingEnabled = false;
    const keys = [[LANDS[seg.land].mount, 1]];
    if (seg.mix > 0.01 && LANDS[seg.land2].mount !== keys[0][0]) keys.push([LANDS[seg.land2].mount, seg.mix]);
    for (const [li, par, sc] of [['far', 0.5, msc], ['near', 1, 1 + (msc - 1) * 0.4]]) {
        for (const [key, alpha] of keys) {
            const layer = getMountains(key, W, H)[li];
            ctx.globalAlpha = alpha;
            const lw = layer.width * MOUNT_PX, lh = layer.height * MOUNT_PX * sc;
            const off = ((bgOffset * par * W) % lw + lw) % lw;

function drawSky(tod, W, H) {
    const hz = H / 2, px = Math.max(-2, Math.min(2, playerX));
    if (tod.night > 0.3) {                             // Mond
        ctx.fillStyle = 'rgba(238,238,238,' + Math.min(1, (tod.night - 0.3) * 2).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(W * 0.22 - px * 60, H * 0.14, Math.min(28, W * 0.07), 0, Math.PI * 2); ctx.fill();
    }
    if (tod.night > 0) {                               // Sterne: feste, gestreute Positionen
        ctx.fillStyle = 'rgba(255,255,255,' + tod.night.toFixed(2) + ')';
        for (let i = 0; i < 40; i++) {
            const fx = ((i * 0.618034) % 1), fy = ((i * i * 0.137 + i * 0.29) % 1);
            ctx.fillRect(fx * W, fy * H * 0.42, i % 7 ? 1.5 : 2.5, i % 7 ? 1.5 : 2.5);
        }
    }

    }

// Tore: zwei Pfosten neben der Fahrbahn, Banner. kind: start, cp (Checkpoint), tor (Gabel, mit Name der nächsten Etappe), ziel
function drawGate(x, y, w, g) {
    const pw = Math.max(2, w * 0.05), h = w * 1.0, xl = x - w * 1.2, xr = x + w * 1.2;
    const st = g.id && STAGES[g.id];
    const col = g.kind === 'cp' ? '#ff8c00' : g.kind === 'tor' ? COL_COLOR[st.col] : '#c00000';
    const txt = g.kind === 'cp' ? 'CHECKPOINT' : g.kind === 'tor' ? st.short : g.kind === 'start' ? 'START' : 'ZIEL';
    ctx.fillStyle = '#d9d9d9';
    ctx.fillRect(xl - pw / 2, y - h, pw, h);
    ctx.fillRect(xr - pw / 2, y - h, pw, h);
    const bh = w * 0.22, by = y - h;
    ctx.fillStyle = col;
    ctx.fillRect(xl, by, xr - xl, bh);
    const sq = (xr - xl) / 16;                       // Schachbrettkante oben und unten
    for (let k = 0; k < 16; k++) {
        ctx.fillStyle = k % 2 ? '#111' : '#fff';
        ctx.fillRect(xl + k * sq, by, sq, bh * 0.18);
        ctx.fillStyle = k % 2 ? '#fff' : '#111';
        ctx.fillRect(xl + k * sq, by + bh * 0.82, sq, bh * 0.18);
    }
    if (w > 12) {
        ctx.fillStyle = g.kind === 'tor' && st.col === 2 ? '#1b2430' : '#fff';
        let fs = Math.round(bh * 0.55);
        ctx.font = 'bold ' + fs + "px 'Courier New', monospace";
        const tw = ctx.measureText(txt).width;
        if (tw > (xr - xl) * 0.92) { fs = Math.floor(fs * (xr - xl) * 0.92 / tw); ctx.font = 'bold ' + fs + "px 'Courier New', monospace"; }
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, x, by + bh * 0.52);
    }
}
// Schilderbrücke vor der Gabel: je Ast ein Feld mit Pfeil, Richtung, Name und Schwierigkeit (1–3 Punkte)
const SIGN_BG = ['#1f6fb2', '#2f8a2f', '#e8edf3'], SIGN_INK = ['#fff', '#fff', '#1b2430'];
function drawSign(x, y, w, branches) {
    const nb = branches.length, xl = x - w * 1.4, xr = x + w * 1.4, pw = Math.max(2, w * 0.05);
    const top = y - w * 1.75, bh = w * 0.9;
    ctx.fillStyle = '#8a929e';
    ctx.fillRect(xl - pw / 2, top, pw, y - top);
    ctx.fillRect(xr - pw / 2, top, pw, y - top);
    ctx.fillStyle = '#222';
    ctx.fillRect(xl - pw, top - pw * 0.5, xr - xl + pw * 2, bh + pw);
    const cw = (xr - xl) / nb, arrows = nb === 3 ? ['←', '↑', '→'] : ['↖', '↗'];
    for (let j = 0; j < nb; j++) {
        const s = STAGES[branches[j]], px = xl + j * cw, ins = Math.max(1, cw * 0.03);
        ctx.fillStyle = SIGN_BG[s.col];
        ctx.fillRect(px + ins, top + ins, cw - ins * 2, bh - ins * 2);

            const tw = ctx.measureText(txt).width, maxW = cw * 0.86;
            if (tw > maxW) ctx.font = 'bold ' + Math.floor(fs * maxW / tw) + 'px sans-serif';
            ctx.fillText(txt, cx, yy);

        fit(arrows[j] + ' ' + COL_NAME[s.col], Math.round(bh * 0.2), top + bh * 0.2);
        fit(s.short, Math.round(bh * 0.24), top + bh * 0.5);
        fit('●'.repeat(s.col + 1) + '○'.repeat(2 - s.col), Math.round(bh * 0.2), top + bh * 0.8);
    }
}
// Spitze des Trenndreiecks: gelbe Warnbake mit Pfeilen nach beiden Seiten
function drawTip(x, y, w) {
    const bw = w * 0.45, bh = w * 0.22, top = y - w * 0.42;
    ctx.fillStyle = '#666'; ctx.fillRect(x - Math.max(1, w * 0.02), top, Math.max(2, w * 0.04), y - top);
    ctx.fillStyle = '#ffd200'; ctx.fillRect(x - bw / 2, top, bw, bh);
    ctx.fillStyle = '#111';
    for (const s of [-1, 1]) {

// --- RENDERING FUNKTIONEN ---
function project(p, cameraX, cameraY, cameraZ) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((canvas.width/2) + (p.screen.scale * p.camera.x * canvas.width/2));
    p.screen.y = Math.round((canvas.height/2) - (p.screen.scale * p.camera.y * canvas.height/2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * canvas.width/2);
}

function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

let glows = [], curDark = 0;                           // Lichtpunkte, die nach dem Abdunkeln leuchten
function render() {
    const W = canvas.width, H = canvas.height, hz = H / 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    const baseSegment = Math.max(0, Math.min(segments.length - 1, Math.floor(position / segmentLength)));
    const basePercent = (position % segmentLength) / segmentLength;
    const playerSegment = segments[baseSegment];
    const tod = timeOfDay(dayPos());
    curDark = tod.dark;
    glows = [];
    drawMountains(playerSegment, W, H);
    ctx.fillStyle = playerSegment.base;                // Boden unter dem Horizont
    ctx.fillRect(0, hz, W, H - hz);

    let maxy = H;
    let x = 0;
    let dx = -(playerSegment.curve * basePercent);
    const cameraY = cameraHeight + (playerSegment.p1.world.y || 0);

    // Straße zeichnen
    for (let n = 0; n < drawDistance; n++) {
        const idx = baseSegment + n;
        if (idx >= segments.length) break;
        const segment = segments[idx];
        segment.clip = maxy;
        const cameraX = playerX * roadWidth - x;
        project(segment.p1, cameraX, cameraY, position);
        project(segment.p2, cameraX - dx, cameraY, position);
        x += dx;
        dx += segment.curve;

        // Nicht zeichnen, wenn hinter uns
        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxy) continue;

        const p1 = segment.p1.screen;
        const p2 = segment.p2.screen;
        const light = segment.color === 'light';
        let rumbleColor = light ? '#ff0000' : '#ffffff';
        let roadColor = light ? '#555555' : '#666666';
        if (segment.gravel) {                          // Schotter: braungrau, Rand aus groberem Kies
            roadColor = light ? '#8a7c69' : '#7f725f';
            rumbleColor = light ? '#6b5f4e' : '#5f5444';
        }
        ctx.fillStyle = light ? segment.gL : segment.gD;   // Gras
        ctx.fillRect(0, p2.y, W, p1.y - p2.y);

        const R1 = segment.roads, R2 = segment.roads2, r1 = p1.w / 5, r2 = p2.w / 5;
        for (let j = 0; j < R1.length; j++) {          // Rumble Strips (erst alle, damit Fahrbahnen sie überdecken)
            const a = p1.x + p1.w * R1[j], b = p2.x + p2.w * R2[j];
            drawPolygon(a - p1.w - r1, p1.y, a - p1.w, p1.y, b - p2.w, p2.y, b - p2.w - r2, p2.y, rumbleColor);
            drawPolygon(a + p1.w + r1, p1.y, a + p1.w, p1.y, b + p2.w, p2.y, b + p2.w + r2, p2.y, rumbleColor);
        }
        for (let j = 0; j < R1.length; j++) {          // Fahrbahnen
            const a = p1.x + p1.w * R1[j], b = p2.x + p2.w * R2[j];
            drawPolygon(a - p1.w, p1.y, a + p1.w, p1.y, b + p2.w, p2.y, b - p2.w, p2.y, roadColor);
        }
        if (segment.checker) {                         // Start-/Zielstrich: Schachbrett über die ganze Breite
            for (let k = 0; k < 8; k++) {
                const f0 = -1 + k * 0.25, f1 = f0 + 0.25;
                drawPolygon(p1.x + p1.w * f0, p1.y, p1.x + p1.w * f1, p1.y, p2.x + p2.w * f1, p2.y, p2.x + p2.w * f0, p2.y,
                            (k + segment.index) % 2 ? '#111' : '#f4f4f4');
            }
            maxy = p2.y;
            continue;
        }
        if (segment.oil !== undefined) {               // Ölfleck: dunkle Lache mit Regenbogenschimmer
            const ox = (p1.x + p2.x) / 2 + (p1.w + p2.w) / 2 * segment.oil, oy = (p1.y + p2.y) / 2;
            const rx = (p1.w + p2.w) / 2 * 0.2, ry = Math.max(1, (p1.y - p2.y) * 1.6);
            ctx.fillStyle = 'rgba(10,10,14,0.85)';
            ctx.beginPath(); ctx.ellipse(ox, oy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
            if (rx > 6) {
                ctx.strokeStyle = 'rgba(120,80,200,0.55)'; ctx.lineWidth = Math.max(1, rx * 0.06);
                ctx.beginPath(); ctx.ellipse(ox - rx * 0.15, oy, rx * 0.6, ry * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeStyle = 'rgba(60,180,160,0.45)';
                ctx.beginPath(); ctx.ellipse(ox + rx * 0.1, oy, rx * 0.35, ry * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
            }
        }
        // Fahrspuren (nicht auf Schotter, nicht wo sich die Äste der Gabel noch überlappen)
        const overlap = R1.length > 1 && Math.abs(R1[1] - R1[0]) < 2.2;
        if (light && !segment.gravel && !overlap) {
            const l1 = p1.w / 3, l2 = p2.w / 3, lw1 = p1.w / 60, lw2 = p2.w / 60;
            for (let j = 0; j < R1.length; j++) {
                const a = p1.x + p1.w * R1[j], b = p2.x + p2.w * R2[j];
                drawPolygon(a - l1 - lw1, p1.y, a - l1 + lw1, p1.y, b - l2 + lw2, p2.y, b - l2 - lw2, p2.y, '#ffffff');
                drawPolygon(a + l1 - lw1, p1.y, a + l1 + lw1, p1.y, b + l2 + lw2, p2.y, b + l2 - lw2, p2.y, '#ffffff');
            }
        }
        maxy = p2.y;
    }

    // Gegner, Randobjekte, Tore und Schilder: von hinten nach vorn, abgeschnitten an Kuppen
    const vis = [];
    for (const o of opponents) {
        const rel = o.z - position;
        if (rel < cameraDepth * 2 || rel >= (drawDistance - 1) * segmentLength) continue;
        const idx = Math.floor(o.z / segmentLength);
        if (idx >= segments.length) continue;
        const seg = segments[idx];
        if (seg.p1.camera.z <= cameraDepth) continue;                       // hinter der Kamera
        vis.push({ o, rel, seg });
    }
    for (let n = 1; n < drawDistance; n++) {
        const idx = baseSegment + n;
        if (idx >= segments.length) break;
        const seg = segments[idx];
        if (seg.p1.camera.z <= cameraDepth) continue;
        const rel = n * segmentLength - (position % segmentLength);
        if (rel < PLAYER_Z) continue;                   // näher als das eigene Auto: würde das halbe Bild zudecken
        for (const sp of seg.sprites) vis.push({ sp, rel, seg });
        if (seg.gates) for (const g of seg.gates) vis.push({ gate: g, rel, seg });
        if (seg.sign) vis.push({ sign: seg.sign, rel, seg });
        if (seg.tip) for (let j = 0; j + 1 < seg.roads.length; j++) vis.push({ tip: (seg.roads[j] + seg.roads[j + 1]) / 2, rel, seg });
    }
    vis.sort((a, b) => b.rel - a.rel);
    for (const v of vis) {
        const { o, sp, seg } = v;
        const a = seg.p1.screen;
        if (!o) {
            if (a.w < 2 || a.y - a.w * 1.6 >= seg.clip) continue;
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
            if (sp) drawSprite(sp, a.x + a.w * sp.offset, a.y, a.w);
            else if (v.gate) drawGate(a.x + a.w * v.gate.o, a.y, a.w, v.gate);
            else if (v.sign) drawSign(a.x, a.y, a.w, v.sign);
            else drawTip(a.x + a.w * v.tip, a.y, a.w);
            ctx.restore();
            continue;
        }
        const t = (o.z % segmentLength) / segmentLength;
        const b = seg.p2.screen;
        if (!(a.scale > 0)) continue;
        const lat = oppLat(o, seg, t);
        if (lat === null) continue;
        const sy = a.y + (b.y - a.y) * t;
        const sw = a.w + (b.w - a.w) * t;              // halbe Straßenbreite in Pixeln
        const sx = a.x + (b.x - a.x) * t + sw * lat;
        const w = sw * CAR_WORLD_W / roadWidth;
        const h = w * 0.6;
        if (w < 2 || sy - h >= seg.clip) continue;      // zu klein oder ganz hinter der Kuppe
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, seg.clip);
        ctx.clip();
        drawCar(sx, sy, w, h, o.color);
        ctx.restore();
        if (curDark > 0.3 && sy - h * 0.15 < seg.clip) for (const s of [-1, 1]) glows.push({ x: sx + s * w * 0.3, y: sy - h * 0.13, r: Math.max(2, w * 0.18), c: '255,40,40' });
    }

    // Tageslicht: Lichtfarbe über die Landschaft legen, dann den Himmel dahinter malen
    if (tod.tint[3] > 0.005) {
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = 'rgba(' + tod.tint[0] + ',' + tod.tint[1] + ',' + tod.tint[2] + ',' + tod.tint[3].toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'destination-over';
    drawSky(tod, W, H);
    ctx.globalCompositeOperation = 'source-over';
    for (const g of glows) {                           // Laternen und Rücklichter im Dunkeln
        const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
        gr.addColorStop(0, 'rgba(' + (g.c || '255,230,150') + ',' + (0.6 * curDark).toFixed(2) + ')');
        gr.addColorStop(1, 'rgba(' + (g.c || '255,230,150') + ',0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
    }

    // Schneefall: Menge nach Landschaft (im Übergang gemischt)
    const snowAmt = (LANDS[playerSegment.land].snow ? 1 - playerSegment.mix : 0) + (LANDS[playerSegment.land2].snow ? playerSegment.mix : 0);
    if (snowAmt > 0.02) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        const nf = Math.round(flakes.length * snowAmt);
        for (let i = 0; i < nf; i++) { const f = flakes[i]; ctx.fillRect(f.x * W, f.y * H, f.s, f.s); }
    }

    // Turbo: Geschwindigkeitsstreifen
    if (isTurbo) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
            const lx = Math.random() * W, ly = Math.random() * H;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + 100 + Math.random() * 200);
            ctx.stroke();
        }
    }

    // Spieler-Auto: steht mittig unten; wackelt im Turbo und auf Schotter
    const carW = W * 0.2;                              // entspricht CAR_WORLD_W im Abstand PLAYER_Z
    const onGravel = segAt(position + PLAYER_Z).gravel && speed > maxSpeed * 0.1;
    const shake = isTurbo ? (Math.random() - 0.5) * 5 : (onGravel ? (Math.random() - 0.5) * 2.5 : 0);
    drawDust();
    if (slipTime > 0) {                                // auf Öl: Auto schlingert sichtbar
        const ang = Math.sin(slipTime * 14) * 0.18 * Math.min(1, slipTime * 2);
        ctx.save(); ctx.translate(W / 2, H - 60); ctx.rotate(ang); ctx.translate(-W / 2, -(H - 60));
        drawCar(W / 2, H - 50, carW, carW * 0.6, '#D40000', true);
        ctx.restore();
    } else drawCar(W / 2 + shake, H - 50 + shake, carW, carW * 0.6, '#D40000', true);
}

// --- FAHRT, TORE, ZEIT ---
// Eine Fahrt = 5 Etappen vom Morgen (Start) bis zu einem der drei Ziele in der Nacht. Jede Etappe hat zwei
// Checkpoints (bei 1/3 und 2/3) und am Ende das Gabeltor. Jedes Tor schreibt die Zeit für das nächste Drittel gut,
// von der Restzeit geht nur die Hälfte mit (schwere Variante). Game Over = von vorn.
const BONUS_SHARE = 0.5;
const KM_PER_UNIT = (300 / 3.6) / maxSpeed / 1000;    // Tacho: maxSpeed = 300 km/h
let phase = 'menu';                                    // menu, race, over (Zeit abgelaufen), done (Ziel erreicht)
let mode = 'rennen';
try { if (localStorage.getItem('autorennen.modus') === 'training') mode = 'training'; } catch (_) {}
let cur = null, trip = null, raceTime = 0, dist = 0, timeLeft = 0;

// Physik eines Zeitschritts (vom Spiel und von der Bot-Fahrt benutzt)
function physicsStep(st, segs, gas, brk, s, turbo, dt) {
    const nS = segs.length, at = (z) => segs[Math.max(0, Math.min(nS - 1, Math.floor(z / segmentLength)))];
    const carSeg = at(st.position + PLAYER_Z);
    st.speed += accel * gas * dt;
    st.speed -= decel * brk * dt;
    st.speed -= accel * 0.35 * (1 - gas) * dt;         // Ausrollen / Motorbremse
    // Steigung: bergauf zieht die Schwerkraft, bergab schiebt sie (Steigung = Höhe pro Weg)
    const slope = (carSeg.p2.world.y - carSeg.p1.world.y) / segmentLength;
    st.speed -= accel * 2.5 * slope * dt;
    const off = roadDist(carSeg, st.playerX) > 1;
    if (off && st.speed > offRoadLimit) st.speed -= offRoadDecel * dt;   // Gras bremst
    if (turbo) st.speed += accel * dt;                 // zusätzlicher Schub
    // Höchsttempo: bergauf weniger (Steigung 0,15 -> 76 %), bergab etwas mehr (bis +12 %), Schotter 85 %
    const hill = Math.max(0.6, Math.min(1.12, 1 - 1.6 * slope)) * (carSeg.gravel ? 0.85 : 1);
    const topSpeed = (turbo ? maxSpeed * TURBO_FACTOR : maxSpeed) * hill;
    if (st.speed > topSpeed) st.speed = Math.max(topSpeed, st.speed - accel * dt * 2);
    if (st.speed < 0) st.speed = 0;
    st.position += st.speed * dt;
    // Lenken und Fliehkraft
    const pSeg = at(st.position), sp = st.speed / maxSpeed, dx = dt * 2 * sp;
    st.playerX += dx * s;
    st.playerX -= dx * sp * pSeg.curve * centrifugal * (carSeg.gravel ? 1.7 : 1);
    // Trenndreieck der Gabel: Leitplanke streifen kostet Tempo und schiebt auf die nähere Fahrbahn
    // Vor dem Gabeltor sind die Fahrbahnen links → rechts sortiert; danach zählt nur noch die gewählte (roads[0])
    const R = carSeg.roads, lo = R[0], hi = carSeg.fork ? R[R.length - 1] : R[0];
    if (carSeg.fork && off && st.playerX > lo && st.playerX < hi) {
        const k = nearestRoad(carSeg, st.playerX);
        st.speed = Math.max(0, st.speed - offRoadDecel * 1.5 * dt);
        st.playerX += Math.sign(R[k] - st.playerX || 1) * dt * 2.5;
        st.hitRail = true;
    }
    st.playerX = Math.max(lo - 2, Math.min(hi + 2, st.playerX));
    return { carSeg, pSeg, off, sp };
}

// Bot-Fahrt: fährt eine Etappe fehlerfrei (Vollgas, kein Turbo, ohne Gegner) und misst die Zeit je Drittel.
// Daraus die Zeitgutschrift: Bot-Zeit × Faktor der Spalte, aufgerundet.
const CAL = {};
function calibrate(id) {
    if (CAL[id]) return CAL[id];
    const keepS = segments, keepO = opponents;
    segments = []; opponents = [];
    const S = appendStage(id, STAGES[id].land, null, true);
    const segs = segments;
    segments = keepS; opponents = keepO;
    const st = { position: 0, playerX: 0, speed: STAGES[id].row === 0 ? 0 : maxSpeed * 0.95 };
    const marks = [S.cps[0], S.cps[1], S.endSeg], times = [], dt = 1 / 60;
    let t = 0;
    while (times.length < 3 && t < 400) {
        const cs = (st.position + PLAYER_Z) / segmentLength;
        while (times.length < 3 && cs >= marks[times.length]) times.push(t);
        const carSeg = segs[Math.min(segs.length - 1, Math.floor(cs))], pSeg = segs[Math.floor(st.position / segmentLength)];
        const sp = st.speed / maxSpeed, target = carSeg.roads[nearestRoad(carSeg, st.playerX)];
        const s = Math.max(-1, Math.min(1, sp * pSeg.curve * centrifugal * (carSeg.gravel ? 1.7 : 1) + (target - st.playerX) * 3));
        physicsStep(st, segs, 1, 0, s, false, dt);
        t += dt;
    }
    const parts = [times[0], times[1] - times[0], times[2] - times[1]];
    const f = TIME_FACTOR[STAGES[id].col];
    return (CAL[id] = { G: parts.map(p => Math.ceil(p * f)), bot: parts, total: times[2] });
}

function carSegF() { return (position + PLAYER_Z) / segmentLength; }
function stageProgress() { return cur ? Math.max(0, Math.min(1, (carSegF() - cur.startSeg) / (cur.endSeg - cur.startSeg))) : 0; }
function dayPos() { return cur ? cur.row + stageProgress() : 0; }

function setupTrip(id) {
    segments = []; opponents = [];
    dustParticles.length = 0;
    position = 0; playerX = 0; speed = 0; dist = 0; raceTime = 0;
    turboEnergy = 1; slipTime = 0; bgOffset = 0;
    cur = appendStage(id, STAGES[id].land, null);
    cur.t0 = 0; cur.G = calibrate(id).G;
    trip = { route: [id], times: [], training: mode === 'training' };
    timeLeft = cur.G[0];
    updateHud(true);
}
function startRace() {
    initAudio();
    if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().then(showSound, () => {});
    setPhase('count');                                 // erst Countdown 3 – 2 – 1 – LOS
    countT = 3; countShown = 0;
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
    modeScreen.hidden = true;
}
// Countdown: große Zahl mitten im Bild, je Zahl ein kurzer Piep, bei LOS ein hoher
let countT = 0, countShown = 0;
const countEl = document.getElementById('count');
function beep(f, len) {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + len + 0.02);
}
function showCount(txt, go) {
    countEl.textContent = txt;
    countEl.classList.remove('an', 'go'); void countEl.offsetWidth;
    countEl.classList.add('an'); if (go) countEl.classList.add('go');
}
function updateCount(dt) {
    countT -= dt;
    const n = Math.ceil(countT);
    if (n > 0 && n !== countShown) { countShown = n; showCount(String(n)); beep(523, 0.15); }
    if (countT <= 0) {
        setPhase('race'); showCount('LOS!', true); beep(1046, 0.45);
        setTimeout(() => countEl.classList.remove('an'), 700);
        const st = STAGES[cur.id];
        showMsg((st.row + 1) + '/5 ' + st.short, ROW_NAME[st.row] + ' · ' + COL_NAME[st.col] + ' · ' + cur.G[0] + ' s bis zum Checkpoint', 3);
    }
}
// Restzeit am Tor: nur die Hälfte geht mit (im Training kann sie negativ sein, dann geht nichts mit)
function carry() { return Math.max(0, timeLeft) * BONUS_SHARE; }
function passCheckpoint() {
    const k = cur.nextCp++, g = cur.G[k + 1], keep = carry(), rest = Math.max(0, timeLeft);
    timeLeft = g + keep;
    showMsg('CHECKPOINT  +' + g + ' s', 'Rest ' + rest.toFixed(1).replace('.', ',') + ' s, davon ' + keep.toFixed(1).replace('.', ',') + ' s mitgenommen');
    if (navigator.vibrate) navigator.vibrate(30);
}
// Am Gabeltor: gewählte Fahrbahn wird zur Mitte, Strecke vorn abschneiden, nächste Etappe anhängen
function commitFork(i) {
    const nb = cur.branches.length, order = [i];
    for (let j = 0; j < nb; j++) if (j !== i) order.push(j);
    const base = Math.floor(position / segmentLength);
    const C = cur.cs[i] * SPLIT_D, cc = cur.cc[i];
    for (let s = base; s < segments.length; s++) {
        const seg = segments[s], tail = seg.tailK !== undefined;
        const sh1 = tail ? seg.roads[i] : C, sh2 = tail ? seg.roads2[i] : C;
        if (tail) seg.curve = cc;                      // die gewählte Fahrbahn biegt ab, die anderen laufen weg
        if (seg.roads.length > 1) {
            const r1 = seg.roads, r2 = seg.roads2;
            seg.roads = order.map(j => r1[j] - sh1); seg.roads2 = order.map(j => r2[j] - sh2);
        } else { seg.roads = [-sh1]; seg.roads2 = [-sh2]; }
        delete seg.fork; delete seg.tip;
        for (const sp of seg.sprites) sp.offset -= sh1;
        if (seg.gates) for (const g of seg.gates) g.o -= sh1;
        if (seg.sign) delete seg.sign;
    }
    playerX -= C;
    for (const o of opponents) if (o.road !== undefined) o.road = order.indexOf(o.road);
    const startSeg = cur.endSeg - base, prevId = cur.id, nextId = cur.branches[i];
    rebase(base);
    const keep = carry(), rest = Math.max(0, timeLeft);
    trip.times.push(raceTime - cur.t0);
    trip.route.push(nextId);
    cur = appendStage(nextId, STAGES[prevId].land, startSeg);
    cur.t0 = raceTime; cur.G = calibrate(nextId).G;
    timeLeft = cur.G[0] + keep;
    const st = STAGES[nextId];
    showMsg((st.row + 1) + '/5 ' + st.short + '  +' + cur.G[0] + ' s',
            'Etappe ' + trip.times.length + ' in ' + fmtTime(trip.times[trip.times.length - 1]) + ' · Rest ' + Math.round(rest) + ' s → ' + keep.toFixed(1).replace('.', ',') + ' s', 3);
    updateHud(true);
}
function fmtTime(s) { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1).replace('.', ','); }

// --- SAMMLUNG (localStorage): gefahrene Routen mit Bestzeit, erreichte Ziele ---
const SAVE_KEY = 'autorennen.sammlung';
let save = { routes: {}, ziele: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && s.routes) save = { routes: s.routes, ziele: s.ziele || {} }; } catch (_) {}
function storeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }
function collectionText() {
    const nR = Object.keys(save.routes).length, nZ = Object.keys(save.ziele).length;
    const best = Object.values(save.routes).reduce((m, v) => Math.min(m, v), Infinity);
    return 'Ziele ' + nZ + '/3 · Routen ' + nR + '/41' + (isFinite(best) ? ' · Bestzeit ' + fmtTime(best) : '');
}

// --- KARTE als Landkarte (SVG): unten Start am Morgen, oben die Ziele in der Nacht, in Fahrtrichtung nach oben.
// Links Meer und Küste, Mitte Land, rechts Gebirge; Straßen als geschwungene Abschnitte zwischen den Orten.
const MAP_POS = {                                      // Lage der Orte (leicht versetzt, damit es nicht wie ein Raster wirkt)
    S: [150, 306], K2: [62, 252], L2: [152, 256], G2: [240, 250], K3: [56, 186], L3: [148, 190], G3: [246, 184],
    K4: [64, 120], L4: [154, 124], G4: [238, 118], K5: [58, 52], L5: [150, 56], G5: [244, 50]
};
function mapSVG(route, clickable) {
    const on = new Set(route || []), edgeOn = new Set();
    for (let k = 1; k < (route || []).length; k++) edgeOn.add(route[k - 1] + '>' + route[k]);
    const P = (id) => MAP_POS[id];
    const road = (a, b) => { const [x1, y1] = P(a), [x2, y2] = P(b), m = (y1 - y2) * 0.45;
        return 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (y1 - m) + ' ' + x2 + ',' + (y2 + m) + ' ' + x2 + ',' + y2; };
    let s = '<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" style="text-shadow:none">' +
        '<defs><linearGradient id="mzeit" x1="0" y1="1" x2="0" y2="0">' +
        '<stop offset="0" stop-color="#ffcf8a" stop-opacity="0.18"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>' +
        '<stop offset="0.7" stop-color="#ff8a4a" stop-opacity="0.12"/><stop offset="1" stop-color="#0a0e3a" stop-opacity="0.55"/></linearGradient>' +
        '<clipPath id="mclip"><rect width="300" height="340" rx="14"/></clipPath></defs><g clip-path="url(#mclip)">';
    // Land, Meer mit Küstenlinie und Strand, Gebirge mit Schneegipfeln, Wüste/Canyon, Vulkan, Stadt
    s += '<rect width="300" height="340" fill="#78b552"/>';
    s += '<path d="M0,0 H92 C80,40 106,70 96,104 C86,140 104,170 92,206 C82,240 100,270 90,300 C84,320 96,332 92,340 H0 Z" fill="#e8d9a0"/>';
    s += '<path d="M0,0 H82 C70,40 96,70 86,104 C76,140 94,170 82,206 C72,240 90,270 80,300 C74,320 86,332 82,340 H0 Z" fill="#3d86c6"/>';
    s += '<path d="M0,0 H60 C50,60 74,120 58,190 C46,250 66,300 56,340 H0 Z" fill="#2f6fae"/>';
    for (const [x, y] of [[30, 210], [44, 160], [24, 175]]) s += '<ellipse cx="' + x + '" cy="' + y + '" rx="9" ry="5" fill="#e8d9a0"/><circle cx="' + x + '" cy="' + (y - 2) + '" r="3" fill="#3f8a3a"/>';
    s += '<path d="M206,340 C200,300 214,270 204,230 C196,190 212,150 200,110 C192,70 208,30 200,0 H300 V340 Z" fill="#9aa0a6"/>';
    for (const [x, y, h] of [[222, 300, 22], [262, 290, 28], [280, 230, 30], [218, 210, 26], [262, 160, 34], [226, 140, 28], [286, 110, 30], [214, 80, 26], [258, 70, 36], [282, 20, 32], [224, 18, 30]]) {
        s += '<path d="M' + (x - h * 0.8) + ',' + y + ' L' + x + ',' + (y - h) + ' L' + (x + h * 0.8) + ',' + y + ' Z" fill="#7d838b"/>';
        s += '<path d="M' + (x - h * 0.3) + ',' + (y - h * 0.62) + ' L' + x + ',' + (y - h) + ' L' + (x + h * 0.3) + ',' + (y - h * 0.62) + ' Z" fill="#f4f7fa"/>';
    }
    s += '<path d="M112,150 C130,132 178,134 196,150 C200,110 186,40 160,30 C130,26 110,60 112,100 Z" fill="#d9b483" opacity="0.9"/>';
    s += '<path d="M128,140 C140,128 168,128 180,140 C176,118 170,108 154,106 C138,108 130,120 128,140 Z" fill="#c46e3c"/>';
    s += '<path d="M48,132 L64,104 L80,132 Z" fill="#3b3533"/><path d="M60,111 L64,104 L68,111 Z" fill="#ff5a1e"/>';
    for (let i = 0; i < 6; i++) s += '<rect x="' + (36 + i * 7) + '" y="' + (30 - (i * 7 % 13)) + '" width="5" height="' + (12 + (i * 7 % 13)) + '" fill="#4a5060"/>';
    s += '<path d="M0,250 C40,256 100,262 152,256 C200,250 250,262 300,256" fill="none" stroke="#5aa0d8" stroke-width="3" opacity="0.8"/>';   // Fluss
    s += '<rect width="300" height="340" fill="url(#mzeit)"/>';
    // Tageszeiten am rechten Rand
    ROW_NAME.forEach((n, r) => { const y = MAP_POS[stageAt(r, 1)][1]; s += '<text x="296" y="' + (y + 3) + '" text-anchor="end" font-family="sans-serif" font-size="8" fill="#fff" opacity="0.85">' + n + '</text>'; });
    [['KÜSTE · leicht', 40], ['LAND · mittel', 150], ['GEBIRGE · schwer', 256]].forEach(([t, x]) => {
        s += '<text x="' + x + '" y="335" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="7.5" fill="#fff" opacity="0.9">' + t + '</text>'; });
    // Straßen: grau mit Mittellinie, gefahrene Abschnitte golden leuchtend
    for (const id in STAGES) for (const nx of nextStages(id)) {
        const d = road(id, nx);
        s += '<path d="' + d + '" fill="none" stroke="#3a3a40" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>';
        s += '<path d="' + d + '" fill="none" stroke="#e8e8e8" stroke-width="0.6" stroke-dasharray="2.5 2.5" opacity="0.8"/>';
    }
    for (const e of edgeOn) {
        const [a, b] = e.split('>'), d = road(a, b);
        s += '<path d="' + d + '" fill="none" stroke="rgba(255,216,74,0.45)" stroke-width="11" stroke-linecap="round"/>';
        s += '<path d="' + d + '" fill="none" stroke="#ffd84a" stroke-width="4" stroke-linecap="round"/>';
    }
    // Orte: Punkt in der Farbe der Spalte, Name mit hellem Rand, darunter die Schwierigkeit
    for (const id in STAGES) {
        const st = STAGES[id], [x, y] = P(id), hit = on.has(id), dim = route && !hit;
        s += '<g' + (clickable ? ' data-id="' + id + '" style="cursor:pointer"' : '') + (dim ? ' opacity="0.75"' : '') + '>';
        if (clickable) s += '<circle cx="' + x + '" cy="' + y + '" r="26" fill="#000" fill-opacity="0.001"/>';
        s += '<circle cx="' + x + '" cy="' + y + '" r="' + (hit ? 9 : 7) + '" fill="' + COL_COLOR[st.col] + '" stroke="' + (hit ? '#ffd84a' : '#1b1730') + '" stroke-width="' + (hit ? 3 : 2) + '"/>';
        if (st.row === 0) s += '<path d="M' + (x + 6) + ',' + (y - 6) + ' v-16 l12,4 l-12,4" fill="#fff" stroke="#111" stroke-width="1"/>';
        if (st.row === ROWS - 1) s += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="9" fill="' + (save.ziele[id] ? '#c08a00' : '#333') + '">★</text>';
        const lbl = st.name.split(' ')[0], lw = lbl.length * 4.6 + 10;   // kleines Namensschild, nur zur Orientierung
        s += '<rect x="' + (x - lw / 2) + '" y="' + (y - 22) + '" width="' + lw + '" height="11" rx="5.5" fill="rgba(20,18,32,' + (hit ? 0.9 : 0.6) + ')"/>';
        s += '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="8" fill="' + (hit ? '#ffd84a' : '#fff') + '">' + lbl + '</text>';
        s += '</g>';
    }
    return s + '</g></svg>';
}

// Schneeflocken: Anteile der Bildgröße, fallen und treiben in Kurven seitlich
const flakes = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: 1 + Math.floor(Math.random() * 3), v: 0.15 + Math.random() * 0.2 }));
function updateFlakes(dt, curve, sp) {
    for (const f of flakes) {
        f.y += (f.v + sp * 0.35) * dt;
        f.x += (-curve * 0.02 * sp + Math.sin(f.y * 12 + f.v * 50) * 0.02) * dt;
        if (f.y > 1) { f.y -= 1; f.x = Math.random(); }
        if (f.x < 0) f.x += 1; else if (f.x > 1) f.x -= 1;
    }
}

// --- SPIEL-LOGIK ---
function update(dt) {
    if (phase === 'count') updateCount(dt);
    if (phase !== 'race') {
        if (phase === 'done' && speed > 0) {           // nach dem Ziel ausrollen (gebremst)
            const st = { position, playerX, speed };
            physicsStep(st, segments, 0, 0.8, 0, false, dt);
            dist += st.position - position;
            position = st.position; playerX = st.playerX; speed = st.speed;
        } else speed = 0;
        isTurbo = false; squealAmt = 0; gravelAmt = 0; slipTime = 0;
        speedDisplay.innerText = Math.floor(speed / maxSpeed * 300);
        updateDust(dt);
        updateAudio();
        return;
    }
    raceTime += dt;
    timeLeft -= dt;
    if (timeLeft <= 0 && !trip.training) { gameOver(); updateHud(); return; }

    // Gas und Bremse vom Knüppel (oder Pfeil hoch/runter), ohne Gas rollt das Auto aus
    const gas = Math.max(throttle, keys.up ? 1 : 0), brk = Math.max(brake, keys.down ? 1 : 0);
    // Turbo: nur mit Vorrat und erst ab etwas Tempo
    isTurbo = turboHeld && turboEnergy > 0 && speed > maxSpeed * 0.3;
    if (isTurbo) turboEnergy = Math.max(0, turboEnergy - dt / 3);
    else if (!turboHeld) turboEnergy = Math.min(1, turboEnergy + dt / 10);
    turboFill.style.height = (turboEnergy * 100).toFixed(0) + '%';
    turboBtn.classList.toggle('an', isTurbo);

    let s = steer;
    if (keys.left) s = -1;
    else if (keys.right) s = 1;
    // Öl: 1,2 s kaum Lenkwirkung, das Auto schlingert und verliert etwas Tempo
    const carSeg0 = segAt(position + PLAYER_Z);
    if (slipTime <= 0 && carSeg0.oil !== undefined && Math.abs(playerX - carSeg0.oil) < 0.28 && speed > maxSpeed * 0.2) { slipTime = 1.2; playOilSlide(); }
    if (slipTime > 0) {
        slipTime -= dt;
        s *= 0.15;
        playerX += Math.sin(slipTime * 14) * dt * 1.1 * (speed / maxSpeed);
        speed -= accel * 0.6 * dt;
    }
    const st = { position, playerX, speed };
    const ph = physicsStep(st, segments, gas, brk, s, isTurbo, dt);
    dist += st.position - position;
    position = st.position; playerX = st.playerX; speed = st.speed;
    if (st.hitRail && navigator.vibrate && Math.random() < 0.1) navigator.vibrate(20);
    bgOffset += ph.pSeg.curve * ph.sp * dt * 0.02;     // Berge wandern in Kurven

    // Tore
    const cs = carSegF();
    if (cur.nextCp < 2 && cs >= cur.cps[cur.nextCp]) passCheckpoint();
    if (!cur.final && !cur.signShown && cs >= cur.preSeg + 30) {
        cur.signShown = true;
        showMsg('GABELUNG', cur.branches.map(b => STAGES[b].short).join(' · '), 3);
    }
    if (cs >= cur.endSeg) {
        if (cur.final) { finishTrip(); updateHud(); return; }
        commitFork(nearestRoad(segments[Math.floor(cs)], playerX));
    }

    // Gegner fahren mit eigenem Tempo; Auffahren bremst uns auf deren Tempo
    const myZ = position + PLAYER_Z;
    for (let i = opponents.length - 1; i >= 0; i--) {
        const o = opponents[i];
        o.z += o.speed * dt;
        const si = Math.floor(o.z / segmentLength);
        if (si >= segments.length || o.z < position - 30 * segmentLength) { opponents.splice(i, 1); continue; }
        const seg = segments[si];
        if (seg.fork && o.road === undefined) {        // an der Gabel: Ast passend zur Spur
            o.road = seg.roads.length === 3 ? (o.offset < -0.3 ? 0 : o.offset > 0.3 ? 2 : 1) : (o.offset < 0 ? 0 : 1);
        }
        const lat = oppLat(o, seg);
        if (lat === null) { opponents.splice(i, 1); continue; }
        const dz = o.z - myZ;
        // Abstand der Mitten < Autobreite (in Einheiten von playerX: 1 = halbe Straße = roadWidth)
        if (dz > -50 && dz < 250 && Math.abs(playerX - lat) < CAR_WORLD_W / roadWidth && speed > o.speed) {
            speed = o.speed * 0.8;
            const back = position - Math.max(0, o.z - PLAYER_Z - 400);
            position -= back; dist -= back;            // hinter den Gegner zurücksetzen
            if (navigator.vibrate) navigator.vibrate(60);
        }
    }

    // Reifenquietschen: schnell in die Kurve oder hart lenken, oder Vollbremsung aus hohem Tempo
    const speedPercent = speed / maxSpeed;
    const carSeg = segAt(position + PLAYER_Z);
    const offRoadNow = roadDist(carSeg, playerX) > 1;
    // nur wenn man krass einlenkt (Knüppel über 60 %) und dabei sehr schnell ist (über 80 %); enge Kurven verstärken
    const hard = Math.max(0, (Math.abs(s) - 0.6) / 0.4), fast = Math.max(0, (speedPercent - 0.8) / 0.2);
    const sqCurve = Math.min(1, hard * fast * (0.7 + 0.3 * Math.min(1, Math.abs(ph.pSeg.curve) / 5)));
    const sqBrake = brk * Math.max(0, Math.min(1, (speedPercent - 0.5) / 0.5)) * 0.8;
    const onGravelNow = carSeg.gravel;
    squealAmt = offRoadNow || onGravelNow || slipTime > 0 ? 0 : Math.max(sqCurve, sqBrake);
    squealType = curDark > 0.6 ? 'A' : LANDS[carSeg.mix < 0.5 ? carSeg.land : carSeg.land2].sq;
    gravelAmt = onGravelNow && !offRoadNow ? Math.min(1, speedPercent * 1.1) * (0.6 + 0.4 * Math.max(sqCurve, Math.abs(s))) : 0;
    updateFlakes(dt, ph.pSeg.curve, speedPercent);

    speedDisplay.innerText = Math.floor(speed / maxSpeed * 300); // Fake km/h
    updateHud();
    updateDust(dt);
    updateAudio();
}

    requestAnimationFrame(gameLoop);
}

let checking = false, announced = null;
async function checkForUpdate(manual = false) {
    if (checking) return;
    if (!manual && document.visibilityState !== 'visible') return;
    if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich'); return; }
    checking = true;
    try {
        const res = await fetch('index.html', { cache: 'no-store' });
        if (!res.ok) { if (manual) showInfo('Prüfung fehlgeschlagen'); return; }
        const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
        if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
        else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4);
    } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen'); }
    finally { checking = false; }
}
function announceUpdate(v, manual) {
    if (announced === v && !manual) return;
    announced = v;
    zeigeBanner('Neue Version ' + v + ' ist da');
    setTimeout(() => location.reload(), manual ? 1500 : 3000);
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));

// Nach einem Update einmal sagen, welche Fassung jetzt läuft
{
    const GESEHEN = 'autorennen.gesehen';
    let vorher = null;
    try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
    if (vorher !== APP_VERSION) {
        try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
        if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
    }
}

// Service Worker: eigene Dateien "Netz zuerst", damit Updates nicht im Cache hängen bleiben
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
