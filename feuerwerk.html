<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autorennen – Feuerwerk im Ziel (Entwürfe 2)</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8ecf4; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
           background: linear-gradient(transparent, rgba(0,0,0,.75)); }
    button { font: bold 15px system-ui; color: #fff; background: #2a2f4a; border: 2px solid #4a5280; border-radius: 10px; padding: 9px 12px; }
    button.on { background: #c8102e; border-color: #ff6b6b; }
    #ton { background: #1f6f2f; border-color: #57c46b; }
    #info { position: fixed; top: 10px; left: 0; right: 0; text-align: center; font-size: 14px; opacity: .85; text-shadow: 0 1px 2px #000; padding: 0 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Feuerwerk im Ziel · Entwürfe 2 · erst <b>TON AN</b> tippen</div>
<div id="bar">
    <button id="ton">🔊 TON AN</button>
    <button data-v="A" class="on">A Pfingstrose</button>
    <button data-v="B">B Goldregen</button>
    <button data-v="C">C Knistern</button>
    <button data-v="D">D Finale</button>
</div>
<script>
// ---------- Ton (Web Audio): Pfeifen beim Aufstieg, Knall mit Bass, Knistern ----------
let AC = null, master = null, noiseBuf = null;
function audioInit() {
    if (AC) { AC.resume(); return; }
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9;
    const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function noise(t, dur, f0, f1, q, g0, type = 'lowpass') {
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
function sfxLaunch(pan, dur) {
    if (!AC) return; const t = AC.currentTime;
    noise(t, dur, 900, 2600, 6, 0.07, 'bandpass');                       // Zischen/Pfeifen der Rakete
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(2600, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.025, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
}
function sfxBang(size, delay) {
    if (!AC) return; const t = AC.currentTime + delay;
    noise(t, 0.9 + size * 0.6, 3500, 180, 0.7, 0.9 * size);            // Knall: breites Rauschen, schnell dumpfer
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine';   // Bass-Wumms
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.8 * size, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.75);
    noise(t + 0.25, 1.6, 600, 120, 0.5, 0.12 * size);                   // Nachhall
}
function sfxCrackle(n, delay, spread) {
    if (!AC) return; const t0 = AC.currentTime + delay;
    for (let i = 0; i < n; i++) noise(t0 + Math.random() * spread, 0.02 + Math.random() * 0.03, 6000, 2500, 1, 0.15 + Math.random() * 0.2, 'highpass');
}
// ---------- Bild ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, DPR;
function fit() { DPR = Math.min(1.5, devicePixelRatio || 1); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; bg = null; }
addEventListener('resize', fit);
let bg = null;
function background() {                                // Himmel + Silhouette mit Zieltor (einmal gerechnet)
    bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d');
    const sky = b.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#02030c'); sky.addColorStop(0.7, '#0d1030'); sky.addColorStop(1, '#1a1d3a');
    b.fillStyle = sky; b.fillRect(0, 0, W, H);
    for (let i = 0; i < 160; i++) { b.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.6).toFixed(2) + ')'; b.fillRect(Math.random() * W, Math.random() * H * 0.7, DPR, DPR); }
}
function silhouette() {
    g.fillStyle = '#05060c';
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += W / 30) g.lineTo(x, H * 0.84 - Math.abs(Math.sin(x / W * 9 + 1)) * H * 0.06 - (Math.abs(x - W / 2) > W * 0.3 ? H * 0.03 : 0));
    g.lineTo(W, H); g.fill();
    const gw = Math.min(W * 0.5, H * 0.45), gx = W / 2 - gw / 2, gy = H * 0.72;
    g.fillStyle = '#7a0a1c'; g.fillRect(gx, gy, gw, H * 0.04); g.fillStyle = '#20222a'; g.fillRect(gx, gy, gw * 0.03, H * 0.28); g.fillRect(gx + gw * 0.97, gy, gw * 0.03, H * 0.28);
}
// Leuchtpunkt-Stempel je Farbe (vorgerechnet, schnell): heller Kern + weicher Schein
const puff = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');   // weicher Rauchballen
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(90,92,110,0.5)'); gr.addColorStop(1, 'rgba(90,92,110,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; })();
const stamps = {};
function stamp(col) {
    if (stamps[col]) return stamps[col];
    const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d');
    const gr = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, col.replace('A', '1')); gr.addColorStop(0.35, col.replace('A', '0.35')); gr.addColorStop(1, col.replace('A', '0'));
    x.fillStyle = gr; x.fillRect(0, 0, s, s); return (stamps[col] = c);
}
const PAL = ['rgba(255,70,70,A)', 'rgba(255,210,80,A)', 'rgba(80,190,255,A)', 'rgba(120,255,120,A)', 'rgba(255,90,240,A)', 'rgba(255,255,255,A)', 'rgba(255,150,50,A)', 'rgba(170,120,255,A)'];
const GOLD = 'rgba(255,190,90,A)';
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
let rockets = [], stars = [], smoke = [], flashes = [];
function launch(type, xf) {
    const x = (xf !== undefined ? xf : rnd(0.2, 0.8)) * W, apex = rnd(0.15, 0.38) * H, h = H * 0.9 - apex;
    const vy = -Math.sqrt(2 * 1.1 * H * h);              // Steiggeschwindigkeit für die Gipfelhöhe
    rockets.push({ x, y: H * 0.9, vx: rnd(-0.04, 0.04) * W, vy, type, col: pick(PAL), col2: pick(PAL) });
    sfxLaunch(0, Math.abs(vy) / (1.1 * H));
}
function sphere(n, cb) { for (let i = 0; i < n; i++) { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u); cb(Math.cos(a) * s, Math.sin(a) * s, u); } }
function explode(r) {
    const S = Math.min(W, H), t = r.type;
    const add = (o) => stars.push(Object.assign({ x: r.x, y: r.y, px: r.x, py: r.y, age: 0, drag: 1.9, g: 0.25 * S, size: S * 0.012 }, o));
    let size = 1;
    if (t === 'peony') sphere(260, (x, y) => { const v = S * rnd(0.62, 0.7); add({ vx: x * v, vy: y * v, life: rnd(1.5, 2.1), col: r.col }); });
    if (t === 'double') { sphere(200, (x, y) => { const v = S * 0.7; add({ vx: x * v, vy: y * v, life: 1.9, col: r.col }); });
                          sphere(90, (x, y) => { const v = S * 0.33; add({ vx: x * v, vy: y * v, life: 1.6, col: r.col2 }); }); }
    if (t === 'willow') { size = 0.8; sphere(180, (x, y) => { const v = S * rnd(0.45, 0.55); add({ vx: x * v, vy: y * v, life: rnd(3.2, 4.2), col: GOLD, drag: 1.3, g: 0.3 * S, size: S * 0.009, gold: true }); }); }
    if (t === 'crackle') sphere(220, (x, y) => { const v = S * rnd(0.55, 0.68); add({ vx: x * v, vy: y * v, life: rnd(1.3, 1.7), col: r.col, col2: 'rgba(255,255,255,A)', crackle: true }); });
    if (t === 'ring') { const tilt = rnd(0.3, 0.8), rot = rnd(0, 3.14);
        for (let i = 0; i < 90; i++) { const a = i / 90 * 6.283, cx = Math.cos(a), cy = Math.sin(a) * tilt, v = S * 0.62;
            add({ vx: (cx * Math.cos(rot) - cy * Math.sin(rot)) * v, vy: (cx * Math.sin(rot) + cy * Math.cos(rot)) * v, life: 1.8, col: r.col }); }
        sphere(40, (x, y) => add({ vx: x * S * 0.15, vy: y * S * 0.15, life: 1.4, col: r.col2 })); }
    if (t === 'palm') { size = 1.2; for (let i = 0; i < 11; i++) { const a = -Math.PI / 2 + (i - 5) * 0.36, v = S * 0.75;
        add({ vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.85, life: 2.6, col: GOLD, drag: 1.0, g: 0.38 * S, size: S * 0.022, gold: true, comet: true }); } }
    if (t === 'strobe') sphere(160, (x, y) => { const v = S * rnd(0.5, 0.62); add({ vx: x * v, vy: y * v, life: rnd(2.2, 2.8), col: 'rgba(255,255,255,A)', strobe: Math.random() * 6 }); });
    flashes.push({ x: r.x, y: r.y, a: 0.5 * size, col: r.col });
    for (let i = 0; i < 6; i++) smoke.push({ x: r.x + rnd(-1, 1) * S * 0.12, y: r.y + rnd(-1, 1) * S * 0.12, r: S * rnd(0.08, 0.16), a: 0.10, age: 0, col: r.col });
    const dist = rnd(0.15, 0.45);                       // Schall kommt später als das Licht
    sfxBang(size * rnd(0.8, 1), dist);
    if (t === 'crackle') sfxCrackle(70, 1.0, 0.7);
    if (t === 'willow' || t === 'palm') sfxCrackle(25, 0.6, 2.2);
}
let plan = 'A', next = 0, T = 0;
const PLANS = {
    A: () => { launch(pick(['peony', 'double'])); return rnd(1.1, 1.6); },
    B: () => { launch(pick(['willow', 'willow', 'palm'])); return rnd(1.6, 2.2); },
    C: () => { launch(pick(['crackle', 'strobe'])); return rnd(1.2, 1.7); },
    D: () => {                                          // Finale: gemischt, alle 8 s eine Salve
        const ph = T % 8;
        if (ph > 6.4) { for (let i = 0; i < 5; i++) launch(pick(['peony', 'crackle', 'ring', 'double']), 0.12 + i * 0.19); return 0.45; }
        launch(pick(['peony', 'ring', 'palm', 'willow', 'crackle', 'double', 'strobe'])); if (Math.random() < 0.45) launch(pick(['peony', 'ring']));
        return rnd(0.55, 0.95);
    }
};
function step(dt) {
    T += dt; next -= dt;
    if (next <= 0) next = PLANS[plan]();
    for (const r of rockets) {
        r.vy += 1.1 * H * dt; r.x += r.vx * dt; r.y += r.vy * dt;
        for (let k = 0; k < 2; k++) stars.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: rnd(-0.02, 0.02) * W, vy: rnd(0.01, 0.06) * H, age: 0, life: rnd(0.3, 0.6), col: GOLD, drag: 3, g: 0.1 * H, size: Math.min(W, H) * 0.006, spark: true });
        if (r.vy >= -0.02 * H) { r.dead = true; explode(r); }
    }
    for (const s of stars) {
        s.age += dt; s.px = s.x; s.py = s.y;
        const d = Math.exp(-s.drag * dt); s.vx *= d; s.vy = s.vy * d + s.g * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.comet && Math.random() < 0.8) stars.push({ x: s.x, y: s.y, px: s.x, py: s.y, vx: rnd(-1, 1) * 20, vy: rnd(0, 40), age: 0, life: rnd(0.5, 1.1), col: GOLD, drag: 2, g: 0.15 * H, size: s.size * 0.4, spark: true });
        if (s.crackle && !s.cr && s.age > s.life * 0.6) { s.cr = true;
            for (let k = 0; k < 4; k++) stars.push({ x: s.x, y: s.y, px: s.x, py: s.y, vx: rnd(-1, 1) * 60 * DPR, vy: rnd(-1, 1) * 60 * DPR, age: -rnd(0, 0.5), life: 0.12, col: 'rgba(255,255,255,A)', drag: 0, g: 0, size: s.size * 0.9, pop: true }); }
    }
    for (const f of flashes) f.a -= dt * 2.2;
    for (const m of smoke) { m.age += dt; m.r += dt * m.r * 0.08; m.y -= dt * 6 * DPR; m.x += dt * 8 * DPR; }
    rockets = rockets.filter(r => !r.dead); stars = stars.filter(s => s.age < s.life); flashes = flashes.filter(f => f.a > 0); smoke = smoke.filter(m => m.age < 9);
}
function draw() {
    if (!bg) background();
    // Bewegungsunschärfe: das alte Bild nur teilweise überdecken → Leuchtspuren entstehen von selbst
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.28; g.drawImage(bg, 0, 0); g.globalAlpha = 1;
    for (const m of smoke) {                           // Rauchwolken, vom Feuerwerk angeleuchtet
        const a = m.a * Math.min(1, m.age * 2) * (1 - m.age / 9);
        g.globalAlpha = a * 0.6; g.drawImage(puff, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2); g.globalAlpha = 1;
    }
    g.globalCompositeOperation = 'lighter';
    for (const f of flashes) {                         // Lichtblitz erhellt den Himmel
        const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, Math.max(W, H) * 0.6);
        gr.addColorStop(0, f.col.replace('A', (f.a * 0.5).toFixed(3))); gr.addColorStop(1, f.col.replace('A', '0')); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    for (const r of rockets) { const st = stamp(GOLD), z = Math.min(W, H) * 0.05; g.drawImage(st, r.x - z / 2, r.y - z / 2, z, z); }
    for (const s of stars) {
        if (s.age < 0) continue;
        const k = s.age / s.life;
        let a = k < 0.7 ? 1 : Math.max(0, 1 - (k - 0.7) / 0.3);
        if (s.gold) a *= 0.7 + 0.3 * Math.sin(s.age * 50 + s.x);
        if (s.strobe !== undefined && k > 0.35) a *= (Math.sin(s.age * 40 + s.strobe) > 0.3 ? 1 : 0.05);
        const col = s.col2 && k > 0.5 ? s.col2 : s.col, st = stamp(col);
        const z = s.size * (s.spark ? 2 : 3) * (s.pop ? 1.6 : 1);
        g.globalAlpha = a;
        if (!s.spark && !s.pop) {                      // kurze Leuchtspur zwischen letzter und jetziger Lage
            g.strokeStyle = col.replace('A', (0.5 * a).toFixed(3)); g.lineWidth = s.size * 0.6; g.lineCap = 'round';
            g.beginPath(); g.moveTo(s.px, s.py); g.lineTo(s.x, s.y); g.stroke();
        }
        g.drawImage(st, s.x - z / 2, s.y - z / 2, z, z);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    silhouette();
}
fit();
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); draw(); requestAnimationFrame(loop); })(last);
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    plan = b.dataset.v; next = 0; T = 0; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); audioInit();
}));
document.getElementById('ton').addEventListener('click', (e) => { audioInit(); e.target.textContent = '🔊 TON IST AN'; });
</script>
</body>
</html>
