<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autorennen – Entwürfe fürs eigene Auto</title>
<style>
  body { margin: 0; background: #1b1e26; color: #f1efe6; font-family: -apple-system, system-ui, sans-serif; }
  header { padding: max(env(safe-area-inset-top), 16px) 16px 4px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; font-size: 14px; opacity: .75; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 14px 16px 30px; }
  .card { background: #242833; border-radius: 14px; overflow: hidden; }
  .card canvas { display: block; width: 100%; height: auto; }
  .card .txt { padding: 10px 14px 14px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card h2 b { color: #f2b632; margin-right: 6px; }
  .card p { margin: 0; font-size: 14px; line-height: 1.4; opacity: .85; }
  .klein { font-size: 12px; opacity: .6; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Rotes Cabrio von hinten – vier Entwürfe</h1>
  <p>Jeweils groß zum Ansehen und unten rechts in echter Spielgröße. Such dir einen aus (A, B, C oder D),
     gern auch gemischt („Heck von B, Flügel von C“).</p>
</header>
<div class="grid" id="grid"></div>

<script>
// Alle Entwürfe: Fußpunkt unten Mitte (x, y), Breite w, Zeit t in Sekunden.
// Gleiche Schnittstelle wie im Spiel, damit der gewählte Entwurf direkt übernommen werden kann.

let ctx;
const RED = '#d40000', RED_DARK = '#9e0000', RED_LIGHT = '#ff3b30';

function rr(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, c, a0 = 0, a1 = Math.PI * 2) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }

// Breite Reifen mit Profil, links/rechts außen
function tires(x, y, w, outer = 0.52, tw = 0.2, th = 0.3) {
  for (const s of [-1, 1]) {
    const tx = x + s * (outer - tw / 2) * w - tw * w / 2, ty = y - th * w;
    rr(tx, ty, tw * w, th * w, tw * w * 0.2, '#111');
    rr(tx + tw * w * 0.12, ty + th * w * 0.06, tw * w * 0.76, th * w * 0.86, 2, '#2c2c2c');
    ctx.fillStyle = '#0a0a0a';
    for (let g = 1; g < 5; g++) ctx.fillRect(tx + tw * w * 0.12, ty + th * w * g * 0.19, tw * w * 0.76, th * w * 0.05);
    ctx.fillStyle = '#3d3d3d';
    ctx.fillRect(s < 0 ? tx + tw * w * 0.02 : tx + tw * w * 0.86, ty + th * w * 0.1, tw * w * 0.12, th * w * 0.8);
  }
}
function shadow(x, y, w) { ell(x, y + w * 0.01, w * 0.6, w * 0.07, 'rgba(0,0,0,0.45)'); }

// Zwei Insassen ab Schulter; rim = Höhe der Cockpitkante. Haare der Beifahrerin wehen im Fahrtwind.
function occupants(x, rim, w, t, opt = {}) {
  const r = w * 0.085, dx = w * 0.17, hy = rim - w * 0.13;
  // Fahrer links
  ell(x - dx, rim + w * 0.01, r * 1.7, r * 1.1, opt.shirtL || '#2a4d9b', Math.PI, 0);
  circle(x - dx - r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx + r * 0.95, hy + r * 0.15, r * 0.28, '#f0c090');
  circle(x - dx, hy, r, '#5a3418');
  circle(x - dx - r * 0.3, hy - r * 0.35, r * 0.35, '#7a4a26');
  if (opt.cap) { ell(x - dx, hy - r * 0.25, r * 1.05, r * 0.8, opt.cap, Math.PI, 0); }
  // Beifahrerin rechts: lange Haare, Spitzen wehen nach außen
  ell(x + dx, rim + w * 0.01, r * 1.6, r * 1.05, opt.shirtR || '#e8578f', Math.PI, 0);
  const wave = Math.sin(t * 9) * r * 0.25;
  ctx.fillStyle = '#f5c542';
  ctx.beginPath();
  ctx.moveTo(x + dx - r * 1.05, hy);
  ctx.quadraticCurveTo(x + dx - r * 1.3, hy + r * 1.3, x + dx - r * 0.6 + wave * 0.3, hy + r * 1.7);
  ctx.lineTo(x + dx + r * 1.5 + wave, hy + r * 1.4);
  ctx.quadraticCurveTo(x + dx + r * 1.4, hy + r * 0.4, x + dx + r * 1.0, hy);
  ctx.closePath(); ctx.fill();
  circle(x + dx, hy - r * 0.05, r * 1.05, '#f5c542');
  circle(x + dx - r * 0.3, hy - r * 0.4, r * 0.35, '#ffe08a');
  if (opt.ribbon) rr(x + dx - r * 1.05, hy - r * 0.35, r * 2.1, r * 0.3, 2, opt.ribbon);
}

// ---------- A: Klassik-Roadster ----------
// Rundes Heck, zwei Höcker hinter den Kopfstützen, runde Doppelrückleuchten, Chromstoßstange.
function carA(x, y, w, t) {
  const bob = Math.sin(t * 22) * w * 0.004; y += bob;
  shadow(x, y, w);
  tires(x, y, w, 0.54, 0.2, 0.27);
  const rim = y - w * 0.4;
  occupants(x, rim, w, t);
  // Höcker (Überrollschutz) hinter beiden Köpfen
  for (const s of [-1, 1]) ell(x + s * w * 0.17, rim + w * 0.02, w * 0.11, w * 0.07, RED_DARK, Math.PI, 0);
  // Heckdeckel, oben stark gerundet
  rr(x - w * 0.46, rim, w * 0.92, w * 0.36, [w * 0.2, w * 0.2, w * 0.06, w * 0.06], RED);
  rr(x - w * 0.42, rim + w * 0.03, w * 0.84, w * 0.04, w * 0.02, RED_LIGHT);       // Glanzkante
  // runde Doppelrückleuchten
  for (const s of [-1, 1]) {
    circle(x + s * w * 0.33, rim + w * 0.15, w * 0.045, '#5a0000');
    circle(x + s * w * 0.33, rim + w * 0.15, w * 0.034, '#ff2a2a');
    circle(x + s * w * 0.23, rim + w * 0.15, w * 0.045, '#5a0000');
    circle(x + s * w * 0.23, rim + w * 0.15, w * 0.034, '#ff6a3a');
  }
  rr(x - w * 0.09, rim + w * 0.12, w * 0.18, w * 0.07, 2, '#f2f2f2');               // Kennzeichen
  rr(x - w * 0.48, y - w * 0.09, w * 0.96, w * 0.035, w * 0.017, '#cfd6dd');        // Chromstoßstange
  circle(x - w * 0.07, y - w * 0.035, w * 0.022, '#222');                           // Doppelauspuff
  circle(x + w * 0.07, y - w * 0.035, w * 0.022, '#222');
}

// ---------- B: Keil-Sportler (80er) ----------
// Flach und breit, Leuchtband über die ganze Breite, Entenbürzel-Spoiler, Diffusor, vier Endrohre.
function carB(x, y, w, t) {
  const bob = Math.sin(t * 22) * w * 0.004; y += bob;
  shadow(x, y, w);
  tires(x, y, w, 0.52, 0.21, 0.26);
  const rim = y - w * 0.33;
  occupants(x, rim, w, t, { shirtL: '#ffffff', shirtR: '#1b1b1b' });
  // Keil-Heck: oben schmaler
  poly([[x - w * 0.38, rim - w * 0.01], [x + w * 0.38, rim - w * 0.01], [x + w * 0.49, rim + w * 0.12],
        [x + w * 0.48, y - w * 0.05], [x - w * 0.48, y - w * 0.05], [x - w * 0.49, rim + w * 0.12]], RED);
  poly([[x - w * 0.4, rim - w * 0.04], [x + w * 0.4, rim - w * 0.04], [x + w * 0.42, rim], [x - w * 0.42, rim]], RED_DARK); // Spoilerlippe
  // Leuchtband
  rr(x - w * 0.46, rim + w * 0.1, w * 0.92, w * 0.075, 2, '#140000');
  rr(x - w * 0.44, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rr(x + w * 0.19, rim + w * 0.115, w * 0.25, w * 0.045, 1, '#ff2a2a');
  rr(x - w * 0.17, rim + w * 0.13, w * 0.34, w * 0.012, 1, '#ff2a2a');
  // Diffusor mit Lamellen, vier Endrohre
  rr(x - w * 0.36, y - w * 0.11, w * 0.72, w * 0.07, 2, '#151515');
  ctx.fillStyle = '#2a2a2a';
  for (let i = -2; i <= 2; i++) ctx.fillRect(x + i * w * 0.07 - w * 0.006, y - w * 0.11, w * 0.012, w * 0.07);
  for (const ex of [-0.3, -0.24, 0.24, 0.3]) { circle(x + ex * w, y - w * 0.07, w * 0.024, '#888'); circle(x + ex * w, y - w * 0.07, w * 0.015, '#111'); }
}

// ---------- C: Speedster (Rennwagen) ----------
// Sehr flach, Startnummer, weiße Doppelstreifen, kleiner Heckflügel auf Stützen, Regenlicht in der Mitte.
function carC(x, y, w, t) {
  const bob = Math.sin(t * 26) * w * 0.005; y += bob;
  shadow(x, y, w);
  tires(x, y, w, 0.52, 0.22, 0.3);
  const rim = y - w * 0.3;
  occupants(x, rim, w, t, { cap: '#ffffff', ribbon: '#d40000' });
  // Höcker hinter beiden Sitzen, mit weißem Streifen
  for (const s of [-1, 1]) ell(x + s * w * 0.17, rim + w * 0.01, w * 0.1, w * 0.08, RED, Math.PI, 0);
  // flaches Heck
  rr(x - w * 0.47, rim, w * 0.94, w * 0.27, [w * 0.08, w * 0.08, w * 0.04, w * 0.04], RED);
  ctx.fillStyle = '#fff';                                                         // Doppelstreifen
  ctx.fillRect(x - w * 0.07, rim, w * 0.045, w * 0.27);
  ctx.fillRect(x + w * 0.025, rim, w * 0.045, w * 0.27);
  // Heckflügel auf zwei Stützen
  ctx.fillStyle = '#222';
  ctx.fillRect(x - w * 0.3, rim - w * 0.02, w * 0.025, w * 0.06);
  ctx.fillRect(x + w * 0.275, rim - w * 0.02, w * 0.025, w * 0.06);
  rr(x - w * 0.42, rim - w * 0.05, w * 0.84, w * 0.04, w * 0.01, '#1a1a1a');
  rr(x - w * 0.42, rim - w * 0.05, w * 0.84, w * 0.012, w * 0.006, '#444');
  // Startnummer
  circle(x - w * 0.28, rim + w * 0.13, w * 0.065, '#fff');
  ctx.fillStyle = '#111'; ctx.font = 'bold ' + Math.round(w * 0.09) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('7', x - w * 0.28, rim + w * 0.135);
  // Rückleuchten außen, Regenlicht Mitte (blinkt)
  rr(x + w * 0.24, rim + w * 0.1, w * 0.16, w * 0.05, 2, '#ff2a2a');
  rr(x - w * 0.4, rim + w * 0.21, w * 0.12, w * 0.03, 2, '#ff2a2a');
  rr(x - w * 0.035, y - w * 0.1, w * 0.07, w * 0.05, 1, (Math.floor(t * 4) % 2) ? '#ff2a2a' : '#5a0000');
  rr(x - w * 0.4, y - w * 0.05, w * 0.8, w * 0.025, 1, '#111');                    // Unterboden
}

// ---------- D: Retro-Cabrio (60er) ----------
// Zwei runde Kotflügel mit Senke dazwischen, ovale Rückleuchten, zweifarbig, viel Chrom.
function carD(x, y, w, t) {
  const bob = Math.sin(t * 20) * w * 0.004; y += bob;
  shadow(x, y, w);
  tires(x, y, w, 0.54, 0.2, 0.28);
  const rim = y - w * 0.38;
  occupants(x, rim, w, t, { shirtL: '#f4f1e8', shirtR: '#3aa0d8', ribbon: '#ffffff' });
  // Kotflügel links/rechts höher als die Mitte
  for (const s of [-1, 1]) ell(x + s * w * 0.32, rim + w * 0.06, w * 0.17, w * 0.1, RED, Math.PI, 0);
  rr(x - w * 0.49, rim + w * 0.04, w * 0.98, w * 0.28, [w * 0.05, w * 0.05, w * 0.1, w * 0.1], RED);
  rr(x - w * 0.49, rim + w * 0.2, w * 0.98, w * 0.12, [0, 0, w * 0.1, w * 0.1], RED_DARK);  // untere Hälfte dunkler
  ctx.fillStyle = '#cfd6dd'; ctx.fillRect(x - w * 0.46, rim + w * 0.195, w * 0.92, w * 0.012); // Chromleiste
  // ovale Rückleuchten auf den Kotflügeln
  for (const s of [-1, 1]) {
    ell(x + s * w * 0.34, rim + w * 0.11, w * 0.06, w * 0.035, '#cfd6dd');
    ell(x + s * w * 0.34, rim + w * 0.11, w * 0.048, w * 0.025, '#ff2a2a');
  }
  rr(x - w * 0.09, rim + w * 0.1, w * 0.18, w * 0.07, 2, '#f2f2f2');             // Kennzeichen
  rr(x - w * 0.5, y - w * 0.1, w * 1.0, w * 0.04, w * 0.02, '#e3e8ec');          // breite Chromstoßstange
  rr(x - w * 0.5, y - w * 0.1, w * 1.0, w * 0.012, w * 0.006, '#ffffff');
  circle(x + w * 0.3, y - w * 0.035, w * 0.022, '#888');                           // Endrohr rechts
  circle(x + w * 0.3, y - w * 0.035, w * 0.014, '#222');
}

// ---------- Vorschau ----------
const DESIGNS = [
  { f: carA, k: 'A', name: 'Klassik-Roadster', text: 'Rundes Heck, zwei Höcker hinter den Köpfen, runde Doppel-Rückleuchten, Chromstoßstange, Doppelauspuff.' },
  { f: carB, k: 'B', name: 'Keil-Sportler (80er)', text: 'Flach und breit, rotes Leuchtband über die ganze Breite, Spoilerlippe, Diffusor mit vier Endrohren.' },
  { f: carC, k: 'C', name: 'Speedster (Rennwagen)', text: 'Sehr flach, weiße Doppelstreifen, Startnummer 7, Heckflügel auf Stützen, blinkendes Regenlicht. Fahrer mit weißer Kappe.' },
  { f: carD, k: 'D', name: 'Retro-Cabrio (60er)', text: 'Runde Kotflügel mit Senke dazwischen, zweifarbig mit Chromleiste, ovale Rückleuchten, breite Chromstoßstange.' }
];
const cards = DESIGNS.map(d => {
  const card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
  card.appendChild(cv);
  const tx = document.createElement('div'); tx.className = 'txt';
  tx.innerHTML = '<h2><b>' + d.k + '</b>' + d.name + '</h2><p>' + d.text + '</p><p class="klein">Unten rechts: echte Größe im Spiel (Handy, ca. 80 px breit)</p>';
  card.appendChild(tx);
  document.getElementById('grid').appendChild(card);
  return { cv, d };
});

function road(c, W, H, t) {
  const g = c.createLinearGradient(0, 0, 0, H * 0.35);
  g.addColorStop(0, '#1E90FF'); g.addColorStop(1, '#87CEEB');
  c.fillStyle = g; c.fillRect(0, 0, W, H * 0.35);
  c.fillStyle = '#00b300'; c.fillRect(0, H * 0.35, W, H * 0.65);
  c.fillStyle = '#5a5a5a';
  c.beginPath(); c.moveTo(W * 0.45, H * 0.35); c.lineTo(W * 0.55, H * 0.35); c.lineTo(W * 1.1, H); c.lineTo(-W * 0.1, H); c.closePath(); c.fill();
  c.fillStyle = '#fff';                                      // Mittelstreifen, laufen nach unten
  for (let i = 0; i < 6; i++) {
    const f = ((i / 6) + t * 0.9) % 1, yy = H * 0.35 + f * f * H * 0.65, hh = 4 + f * 26;
    c.fillRect(W / 2 - (1 + f * 5), yy, 2 + f * 10, hh);
  }
}

function frame(ms) {
  const t = ms / 1000;
  for (const { cv, d } of cards) {
    ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    road(ctx, W, H, t);
    d.f(W * 0.42, H * 0.92, W * 0.62, t);                      // groß
    // echte Größe: 80 px breit bei 393 px Bildschirm -> Anteil an der Kartenbreite
    rr(W * 0.79, H * 0.66, W * 0.19, H * 0.3, 8, 'rgba(0,0,0,0.25)');
    d.f(W * 0.885, H * 0.93, W * 0.11, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
